<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ruang Belajar Nadia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky name bar + scrollable tab strip, one working column (max 1080px), cards only where a thing is an object (lecture, question, layer). Single light "sorbet" world on purpose: Nadia asked for nothing dark. */
:root{
  --bg:#FBF7FF;        /* whisper lilac ground */
  --paper:#FFFFFF;
  --ink:#241B4B;       /* deep indigo ink */
  --muted:#6C6590;
  --line:#E7DEF8;
  --soft:#F3ECFF;
  --pop:#FF4F8B;       /* bubblegum: the one loud colour */
  --pop-soft:#FFE3EE;
  --peri:#5B6CFF;
  --peri-soft:#E6E9FF;
  --sun:#FFC83D;
  --sun-soft:#FFF4D1;
  --aqua:#11B3A3;
  --aqua-soft:#D9F7F3;
  --grape:#9B5CF6;
  --grape-soft:#EFE5FF;
  --ok:#0E9F77; --warn:#D98A00; --bad:#E5484D;
  --s1:#5B6CFF; --s2:#FF4F8B; --s3:#E0A400; --s4:#11B3A3; --s5:#9B5CF6;
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--peri)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-body);font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid2>*,.grid3>*{min-width:0}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-badge{width:38px;height:38px;border-radius:12px;background:var(--pop);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:.78rem;color:var(--muted)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:.82rem;white-space:nowrap}
.chip.pop{background:var(--pop-soft);border-color:transparent;color:#B0124A}
.chip.peri{background:var(--peri-soft);border-color:transparent;color:#2C3BD1}
.chip.sun{background:var(--sun-soft);border-color:transparent;color:#8A5B00}
.chip.aqua{background:var(--aqua-soft);border-color:transparent;color:#05756A}
.chip.grape{background:var(--grape-soft);border-color:transparent;color:#6A2FC9}
.chip.bad{background:#FFE5E6;border-color:transparent;color:#B42328}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem;padding:7px 12px;border-radius:999px;border:1.5px solid transparent}
nav.tabs a:hover{color:var(--ink);background:var(--soft)}
nav.tabs a[aria-current="page"]{color:#fff;background:var(--ink)}
main{padding-block:22px 80px}
section.view{display:grid;gap:22px}
.view-head{display:grid;gap:6px}
.view-head p{max-width:65ch;color:var(--muted)}

.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1.5px solid var(--ink);background:var(--paper);padding:7px 14px;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#3A2F6E}
.btn.pop{background:var(--pop);border-color:var(--pop);color:#fff}
.btn.pop:hover{background:#E93C78}
.btn.ghost{border-color:var(--line)}
.btn.tiny{padding:3px 10px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero on beranda */
.hello{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:stretch}
@media (max-width:760px){.hello{grid-template-columns:1fr}}
.hello-main{background:var(--ink);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden;display:grid;gap:12px;align-content:start}
.hello-main h2{font-size:clamp(1.6rem,4vw,2.3rem);color:#fff}
.hello-main .muted{color:#CFC8F0}
.hello-main .doodle{position:absolute;right:-20px;bottom:-24px;width:170px;opacity:.95;pointer-events:none}
.hello-main>*:not(.doodle){position:relative;z-index:1}
@media (max-width:760px){.hello-main .doodle{width:110px;right:-26px;top:-26px;bottom:auto;opacity:.5}.sync-chip{display:none}}
.count{display:flex;gap:16px;flex-wrap:wrap}
.count .n{font-family:var(--f-mono);font-size:2rem;font-weight:700;line-height:1}
.count .l{font-size:.75rem;color:#CFC8F0;letter-spacing:.08em;text-transform:uppercase}
.quote{background:var(--sun-soft);border-radius:22px;padding:20px;display:grid;gap:10px;align-content:space-between}
.quote blockquote{margin:0;font-family:var(--f-display);font-size:1.2rem;font-weight:700;line-height:1.3}

/* steps (milestones) */
.steps-legend{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.ms{border-radius:14px;padding:12px;display:grid;gap:4px;border:1.5px solid var(--line);background:var(--paper)}
.ms .ms-top{display:flex;gap:8px;align-items:center}
.ms .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-weight:700;font-size:.8rem;flex:none}
.ms b{font-family:var(--f-display)}
.ms p{font-size:.84rem;color:var(--muted)}

.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper)}
.task.late{border-color:#F6C3C5;background:#FFF7F7}
.task .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-weight:700}
.task .t{min-width:0}
.task .t b{display:block}
.task .t span{font-size:.84rem;color:var(--muted)}

/* lecture cards */
.lec{display:grid;gap:12px}
.lec-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.lec-no{font-family:var(--f-mono);font-weight:700;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:.85rem}
.lec-title{flex:1;min-width:180px}
.lec-title h3{font-size:1.08rem}
.stepbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stp{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:4px;background:var(--paper);text-align:left;min-width:0}
.stp .nm{font-family:var(--f-display);font-weight:700;font-size:.86rem;line-height:1.1}
.stp .meta{font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.stp.done{color:#fff;border-color:transparent}
.stp.done .meta{color:rgba(255,255,255,.85)}
.stp-actions{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:620px){.stepbar{grid-template-columns:repeat(5,minmax(58px,1fr));overflow-x:auto}.stp .nm{font-size:.76rem}}
.conf{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.conf button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-weight:700}
.conf button.on{background:var(--pop);color:#fff;border-color:var(--pop)}
details.more>summary{cursor:pointer;color:var(--muted);font-size:.88rem;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"– "}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.form label{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:700}

/* summaries */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:860px){.reader{grid-template-columns:minmax(0,1fr)}}
.prose,.reader > *{min-width:0}
.prose{max-width:68ch;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.prose h3{font-size:1.25rem;margin-top:10px;display:flex;gap:10px;align-items:baseline}
.prose h3 .lvl{font-family:var(--f-mono);font-size:.7rem;color:#fff;background:var(--peri);padding:2px 7px;border-radius:6px;letter-spacing:.06em}
.prose ul,.prose ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.prose table{border-collapse:collapse;width:100%;font-size:.9rem}
.prose th,.prose td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.prose th{background:var(--soft)}
.tbl{overflow-x:auto}
.term{background:linear-gradient(transparent 60%,var(--sun-soft) 60%);border-bottom:1.5px dotted var(--warn);cursor:help}
.box{border-radius:12px;padding:12px 14px;display:block}
.box > b:first-child{display:block;margin-bottom:6px}
.box > :last-child{margin-bottom:0}
.box.key{background:var(--peri-soft)}
.box.trap{background:var(--pop-soft)}
.box.clin{background:var(--aqua-soft)}
.box.dsr{background:var(--sun-soft)}
.box.dsr dl{margin:6px 0 0;display:grid;gap:6px}
.box.dsr dt{font-weight:700}
.box.dsr dd{margin:0 0 0 10px}
.box.prin{background:var(--aqua-soft);border-left:4px solid var(--ok)}
.box b.lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.side{position:sticky;top:120px;display:grid;gap:12px;max-height:calc(100vh - 140px);overflow:auto}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:6px;font:inherit;font-size:.85rem;color:var(--ink);cursor:pointer}
.toc button:hover{background:var(--sun-soft)}
.prose h3[id]{scroll-margin-top:120px}
.prose h3[id]{background:var(--peri-soft);border-left:5px solid var(--peri);padding:9px 12px;border-radius:10px;margin-top:22px;color:var(--ink)}
.prose p.sub{font-weight:800;color:var(--peri);border-left:3px solid var(--peri);background:linear-gradient(90deg,var(--peri-soft),transparent);padding:4px 10px;border-radius:0 8px 8px 0;margin:8px 0 0}
.toc-m{display:none;padding:10px 12px}
.toc-m summary{cursor:pointer}
@media (max-width:860px){.toc-m{display:block}.toc-d{display:none}.prose h3[id]{scroll-margin-top:180px}}
@media (max-width:860px){.side{position:static}}
.gloss{max-height:60vh;overflow:auto;display:grid;gap:8px}
.gloss div{font-size:.86rem}
.gloss b{display:block;font-family:var(--f-display)}
.pop-tip{position:fixed;z-index:30;max-width:300px;background:var(--ink);color:#fff;padding:10px 12px;border-radius:10px;font-size:.86rem;box-shadow:0 10px 30px rgba(36,27,75,.25)}
.refs{font-size:.84rem;color:var(--muted);display:grid;gap:4px;padding-left:1.2em;margin:0}

/* anfisio */
.lab{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.lab{grid-template-columns:1fr}}
.svgbox{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:8px;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.layers{display:grid;gap:6px}
.layer{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);text-align:left}
.layer .sw{width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(0,0,0,.15)}
.layer.off{opacity:.45}
.layer.focus{border-color:var(--ink)}
.info{border-radius:14px;padding:14px;background:var(--soft);display:grid;gap:8px}
.info h4{font-size:1.05rem}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.9rem}
.info dt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.info dd{margin:0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem}
.subtabs button.on{background:var(--grape);border-color:var(--grape);color:#fff}
svg .hit{cursor:pointer}
svg .hit:hover{filter:brightness(1.08)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .node{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.88rem}
.flow .arr{color:var(--muted);font-family:var(--f-mono)}

/* quiz */
.q{display:grid;gap:10px}
.q .stem{white-space:pre-line}
.opts{display:grid;gap:6px}
.qimg{display:block;max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);background:#fff;margin:4px 0}
.box.kat{background:var(--soft)}
.opt{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.opt .L{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center}
.opt.sel{border-color:var(--peri);background:var(--peri-soft)}
.opt.sel .L{background:var(--peri);color:#fff}
.opt.right{border-color:var(--ok);background:#E3F8F0}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#FFECEC}
.opt.wrong .L{background:var(--bad);color:#fff}
.review{display:grid;gap:8px;border-top:1.5px dashed var(--line);padding-top:10px;font-size:.93rem}
.review ul{margin:0;padding-left:1.1em;display:grid;gap:3px}
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1}
.qnav{display:flex;flex-wrap:wrap;gap:4px}
.qnav a{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;text-decoration:none;font-family:var(--f-mono);font-size:.8rem;border:1.5px solid var(--line);color:var(--ink);background:var(--paper)}
.qnav a.ans{background:var(--peri-soft);border-color:transparent}
.qnav a.r{background:var(--ok);color:#fff;border-color:transparent}
.qnav a.w{background:var(--bad);color:#fff;border-color:transparent}

/* reasoning */
.case-stage{display:grid;gap:10px}
.reveal{border-left:4px solid var(--grape);padding:8px 12px;background:var(--grape-soft);border-radius:0 10px 10px 0}
.think{display:grid;gap:8px}
.ddx{display:flex;flex-wrap:wrap;gap:6px}
.ddx button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.88rem}
.ddx button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ddx button.out{text-decoration:line-through;opacity:.5}
.ladder{display:grid;gap:8px;counter-reset:lad}
.ladder .rung{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.ladder .rung .k{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;color:#fff}

/* progress */
.meter{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--pop)}
.heat{border-collapse:separate;border-spacing:4px;font-size:.84rem}
.heat td,.heat th{padding:0}
.heat th{font-weight:700;text-align:left;padding-right:8px;white-space:nowrap}
.heat .c{width:30px;height:24px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:#fff}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(110px,180px) 1fr 48px;gap:10px;align-items:center;font-size:.88rem}
.bar .meter>i{background:var(--peri)}

/* banner */
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;max-width:min(560px,calc(100vw - 32px));box-shadow:0 14px 40px rgba(36,27,75,.3)}
.banner .btn{border-color:#fff;color:#fff;background:transparent}
.banner .btn.pop{background:var(--pop);border-color:var(--pop)}
.toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(80px + env(safe-area-inset-top,0px));z-index:41;background:var(--aqua);color:#fff;padding:8px 14px;border-radius:12px;font-weight:700}
.empty{border:2px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--muted)}
.speak{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:700}
.speak.on{background:var(--grape);color:#fff;border-color:var(--grape)}
.ws-back{position:fixed;inset:0;z-index:35;background:rgba(36,27,75,.45);display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ws{background:var(--bg);border-radius:20px;width:min(760px,100%);max-height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 20px 60px rgba(36,27,75,.35)}
.ws-head{padding:16px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.ws-body{padding:16px;overflow:auto;display:grid;gap:16px;align-content:start;min-height:0}
.ws-foot{padding:12px 16px;border-top:1.5px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--paper)}
@media (max-width:620px){.ws-back{padding:0}.ws{border-radius:0;height:100%;width:100%}.ws-head{padding-top:calc(16px + env(safe-area-inset-top,0px))}.ws-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}

/* latar gradasi warna (tanpa motif, sesuai permintaan Nadia) */

/* ===== Program IELTS 2 Bulan (E2) ===== */
.e2-start{border:2px solid var(--pop);background:linear-gradient(135deg,#FFF0F6,#F3ECFF)!important}
.e2-nav{justify-content:center;margin:2px 0}
.e2-task .t span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.e2-weeks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.e2-wk{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px;background:rgba(255,255,255,.9);min-width:0}
.e2-wk.on{border-color:var(--pop);box-shadow:0 0 0 3px var(--pop-soft)}
.e2-dots{display:flex;gap:5px;flex-wrap:wrap}
.e2-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:.74rem;font-weight:700;color:var(--muted);cursor:pointer;padding:0}
.e2-dot.half{background:var(--sun-soft);border-color:var(--sun);color:#8A5A00}
.e2-dot.ok{background:var(--pop);border-color:var(--pop);color:#fff}
.e2-dot.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.e2-tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.e2-tbl th,.e2-tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.e2-tbl th{background:var(--soft);font-weight:700}
.e2-rules{background:var(--sun-soft);border-radius:12px;padding:10px 14px}
.e2-rules summary{cursor:pointer}
.e2-rules ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;font-size:.9rem}

.e2-steps li label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;cursor:pointer}

.e2-steps li label>span>b::before{content:counter(st)". ";color:var(--pop)}
.e2-steps li label>span>.small{display:block;color:var(--ink);opacity:.85;margin-top:2px;line-height:1.5}
.e2-steps li.ok{background:#F1FBF7;border-color:#BDEBD9}
.e2-steps li.ok label>span>b{text-decoration:line-through;text-decoration-color:var(--ok);opacity:.7}
.e2-add summary{cursor:pointer}
.e2-rub{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px}
.e2-rub-l{display:grid;gap:4px}
.e2-rub-l span{background:var(--soft);border-radius:8px;padding:4px 8px}

/* Susun 56 hari */
function e2BuildPlan(){
  const D = []; let r = 0, b = 0, h = 0, t = 0;
  for (let d = 1; d <= 56; d++){
    const w = Math.ceil(d/7), wd = d - (w-1)*7, W = E2_WEEKS[w-1], place = W.places[wd-1];
    let blocks;
    if (w <= 4){
      if (d === 28) blocks = [{k:"srs"},{k:"mock", id:"D28"}];
      else if (wd === 7) blocks = [{k:"srs"},{k:"review", id:"R"+w}];
      else { blocks = [{k:"readM1", src:"oz", ch:r++},{k:"listenBBC", ep:b++},{k:"srs"}]; }
    } else {
      const W2 = "W"+w;
      if (d === 56) blocks = [{k:"srs"},{k:"fullmock", id:"D56"},{k:"write1", id:"MK1"},{k:"write2", id:"MK2"},{k:"speakmock", id:"MK"}];
      else if (wd === 1) blocks = [{k:"readM2", src:"holmes", ch:h++},{k:"srs"},{k:"speak1", id:"P1"+w}];
      else if (wd === 2) blocks = [{k:"listenTED", ted:t++},{k:"srs"},{k:"ieltsL", id:W2}];
      else if (wd === 3) blocks = [{k:"readM2", src:"holmes", ch:h++},{k:"srs"},{k:"write1", id:"T1"+w}];
      else if (wd === 4) blocks = [{k:"listenTED", ted:t++},{k:"srs"},{k:"speak2", id:"P2"+w}];
      else if (wd === 5) blocks = [{k:"readM2", src:"holmes", ch:h++},{k:"srs"},{k:"ieltsR", id:W2}];
      else if (wd === 6) blocks = [{k:"listenTED", ted:t++},{k:"srs"},{k:"write2", id:"T2"+w}];
      else blocks = [{k:"srs"},{k:"speak3", id:"P3"+w},{k:"review", id:"R"+w}];
    }
    D.push({d, w, wd, place, blocks});
  }
  return D;
}

  P15:{part:1, t:"Part 1 · Study, hometown & free time", qs:[
    {q:"Do you work or are you a student?", m:"I'm a student. I'm in my pre-clinical years at medical school, so most of my days are spent in lectures, labs and, honestly, the library. It's demanding, but I really enjoy it."},

  P16:{part:1, t:"Part 1 · Sleep & daily routine", qs:[

  P17:{part:1, t:"Part 1 · Food & cooking", qs:[
    {q:"What kind of food do you like?", m:"I'm a big fan of spicy food, which is pretty typical for Indonesians. Anything with sambal is a winner for me. I also love trying food from other countries when I get the chance."},

    {q:"Is there any food you didn't like as a child but like now?", m:"Yes, vegetables in general, especially bitter ones like bitter melon. I used to push them to the side of the plate, but now I actually enjoy them, maybe because I know how good they are for you."},

  P18:{part:1, t:"Part 1 · Technology & phones", qs:[
    {q:"How often do you use your phone?", m:"Honestly, far too often. I use it for studying, for messaging, and for watching videos, so it's in my hand for several hours a day. I've started using screen-time limits to control it a bit."},

  P25:{part:2, t:"Part 2 · Describe a book you enjoyed reading", card:["Describe a book you enjoyed reading.","You should say:","• what the book was","• when and why you read it","• what it was about","and explain why you enjoyed it."],
    m:"I'd like to talk about The Wonderful Wizard of Oz, which is actually the first full novel I've ever read in English. I read it quite recently, over about four weeks, as part of my English study plan. The idea was to read a little every day, something easy enough to enjoy, instead of studying grammar from a textbook.\n\nThe story is about a girl called Dorothy who lives on a farm in Kansas. One day a cyclone picks up her house and drops it in a magical land called Oz. To get home, she has to travel to the Emerald City to ask a powerful wizard for help, and on the way she makes three friends: a scarecrow who wants a brain, a tin man who wants a heart, and a lion who wants courage.\n\nThe reason I enjoyed it so much is partly the story itself, because it's simple but surprisingly meaningful. Each character already has the thing they think they're missing; they just don't realise it. I found that quite relatable, especially as a student who often feels she isn't clever enough. But I also enjoyed it because of what it did for my English. At the beginning I was stopping every few lines, but by the end I was reading whole pages without thinking about it. Finishing it gave me a real sense of achievement, and it made me want to read more books in English, which I suppose is the best thing a book can do.",
    words:["a real sense of achievement","surprisingly meaningful","I found that quite relatable","without thinking about it","the best thing a book can do"]},
  P26:{part:2, t:"Part 2 · Describe a person who influenced your choice of career", card:["Describe a person who has influenced your choice of career.","You should say:","• who this person is","• how you know them","• what they do","and explain how they influenced your choice."],
    m:"The person I'd like to talk about is a paediatrician who used to treat me when I was a child. I don't remember every visit, but I clearly remember the feeling of going to her clinic, which was strange, because most children are scared of doctors.\n\nShe worked in a small private practice near my house, and my parents took me there whenever I was ill, which, to be honest, was quite often, because I had asthma when I was little. What made her different was how she spoke to me. Instead of only talking to my mum, she would sit down at my level and explain what was happening in really simple words, like 'your lungs are a bit angry today, so we're going to calm them down.'\n\nAt the time, of course, I didn't think about careers at all. But years later, when I had to choose what to study, I kept coming back to that memory. I realised that she had shown me what a good doctor looks like: someone who is not only knowledgeable but also patient and genuinely kind. She made a frightening experience feel safe.\n\nSo in a way, she influenced me twice: first by looking after my health, and later by giving me a model of the kind of doctor I want to become. I'm now hoping to specialise in paediatrics myself, and if I can make even one child feel the way she made me feel, I'll be very happy.",
    words:["sit down at my level","I kept coming back to that memory","genuinely kind","She made a frightening experience feel safe","in a way, she influenced me twice"]},
  P27:{part:2, t:"Part 2 · Describe a place you would like to visit", card:["Describe a place you would like to visit in the future.","You should say:","• where it is","• how you know about it","• what you would like to do there","and explain why you would like to visit it."],
    m:"A place I'd really love to visit one day is Switzerland, and more specifically a village called Lauterbrunnen in the Swiss Alps.\n\nI first came across it on social media. Someone posted a video of this valley with huge cliffs on both sides and dozens of waterfalls pouring down them, and I honestly thought it was edited. Then I looked it up and discovered it's a real place, and since then I've watched a lot of travel vlogs about it. It's even part of my English study app, where every day I complete, I 'visit' a European city.\n\nIf I went there, I'd want to take things slowly. I'd stay in a small wooden guesthouse, walk along the valley to see the waterfalls up close, and take the mountain train up to one of the viewpoints where you can see the snowy peaks. I'd also like to try some proper Swiss food, like cheese fondue, even though I'm not sure how my stomach would cope with that much cheese.\n\nThe main reason I want to go is that it feels like the complete opposite of my daily life. As a medical student, my days are noisy, busy and full of deadlines, and Lauterbrunnen looks incredibly calm. Besides that, travelling to Europe has been a kind of personal goal for me. It's one of the things that keeps me motivated to improve my English, so actually going there would feel like a reward for all the hard work.",
    words:["I first came across it on","I honestly thought it was edited","see the waterfalls up close","the complete opposite of my daily life","it would feel like a reward for all the hard work"]},
  P28:{part:2, t:"Part 2 · Describe a time you learned something difficult", card:["Describe a time when you had to learn something difficult.","You should say:","• what you had to learn","• when you learned it","• how you learned it","and explain how you felt about it."],
    m:"I'm going to talk about the time I had to learn how to read ECGs, the heart tracings doctors use to check the heart's electrical activity. This was during my second year of medical school, in a cardiovascular block that lasted about a month.\n\nAt first, it was overwhelming. An ECG looks like a random line of spikes and waves, and our lecturer was going through it really quickly. After the first lecture, I genuinely felt like I had understood nothing, and that was a bit scary, because we were told it would definitely come up in the exam.\n\nSo I changed my approach. Instead of trying to memorise every abnormal pattern, I went back to the basics and learned what each wave actually represents. Then I made a simple checklist, rate, rhythm, axis, and so on, and practised it on one or two ECGs every single day, using free websites with real examples. I also studied with two friends, and we would quiz each other, which turned it into a bit of a game.\n\nBy the end of the block, I could interpret most common ECGs confidently, and I did well in that part of the exam. Looking back, I feel really proud, not just because I learned the topic, but because I learned something about learning itself: that a little practice every day beats panicking the night before. It's actually the same idea I'm using now to improve my English.",
    words:["At first, it was overwhelming","I genuinely felt like I had understood nothing","I went back to the basics","turned it into a bit of a game","a little practice every day beats panicking the night before"]},
  P35:{part:3, t:"Part 3 · Reading & education", qs:[
    {q:"Why do you think fewer young people read books for pleasure nowadays?", m:"I think the main reason is competition for attention. Books have to compete with short videos and games that give instant rewards, whereas a novel asks you to concentrate for a long time before it pays off. That said, I'm not sure young people read less overall; they read a lot online, just in shorter pieces."},
    {q:"Should schools force children to read certain books?", m:"To some extent, yes. Some books are worth reading because they help children understand their culture or history. But if every book is compulsory, reading starts to feel like homework. I'd say the ideal is a mix: a few set texts, plus plenty of freedom to choose books that match each child's interests."},
    {q:"Do you think e-books will completely replace printed books?", m:"I doubt it, at least not completely. E-books are convenient and cheaper, especially for students, but many people still enjoy the feel of a physical book, and research suggests people sometimes remember more from paper. I imagine both will continue to exist, a bit like how cinema survived the arrival of television."},
    {q:"How can parents encourage their children to read more?", m:"The most effective way is probably to be a role model. If children see their parents reading regularly, they treat it as normal. Reading aloud together at bedtime also helps, and so does letting children choose their own books, even comics, because what matters at first is building the habit, not reading 'serious' literature."}]},
  P36:{part:3, t:"Part 3 · Careers & role models", qs:[
    {q:"What factors do young people consider when choosing a career?", m:"These days I'd say salary and job security come first for many people, especially with the cost of living rising. But I also think more young people care about whether a job is meaningful and whether it allows a decent work-life balance. Family expectations still play a big role in Indonesia as well."},
    {q:"Is it better to follow your passion or choose a job that pays well?", m:"It depends on the person's situation. Ideally, you find something that combines both. If you only follow your passion but can't support yourself, it becomes stressful. On the other hand, a high salary in a job you hate can lead to burnout. I'd say find something you're reasonably good at and interested in, and passion often grows from there."},
    {q:"Do celebrities make good role models for young people?", m:"Some do and some don't. Certain celebrities use their influence to promote good causes, like mental health awareness. However, young people often see only the glamorous side, not the hard work behind it. I think parents, teachers and people in their own community are often more realistic role models."},
    {q:"How has the role of doctors changed compared to the past?", m:"In the past, doctors were seen as authority figures whose decisions were rarely questioned. Nowadays patients are much better informed, partly thanks to the internet, so the relationship has become more of a partnership. Doctors now need strong communication skills to explain options, and sometimes to correct misinformation patients find online."}]},
  P37:{part:3, t:"Part 3 · Tourism & travel", qs:[
    {q:"Why do people like to travel abroad?", m:"For many people it's about experiencing something completely different from everyday life: new food, new landscapes, a different culture. Travel can also be a status symbol, especially now with social media, where people like to share their trips. And for some, it's simply about rest and escaping routine."},
    {q:"What are the negative effects of tourism on local communities?", m:"One major problem is overtourism. In popular places like Venice or Bali, housing becomes expensive because so many properties are turned into holiday rentals, so local people are pushed out. There can also be environmental damage, like pollution and too much pressure on water supplies. That said, tourism also brings jobs, so the key is managing it properly."},
    {q:"Do you think virtual reality could replace real travel in the future?", m:"I don't think it could replace it entirely. VR might be useful for people who can't travel because of money or health problems, and it could let you 'visit' a museum from home. But travel involves so much more than sight: the smell of the food, the weather, talking to real people. Those experiences are very hard to recreate digitally."},
    {q:"How has travel changed in the last twenty years?", m:"It has become far more accessible. Budget airlines and booking apps mean that ordinary people can fly abroad, which was a luxury for my parents' generation. Planning has changed too: now you can check reviews, maps and translations on your phone. The downside is that famous places have become extremely crowded."}]},
  MK:{part:0, t:"Full speaking mock (Part 1 → 2 → 3)", qs:[
    {q:"Part 1. Let's talk about the weather. What's the weather like where you live?", m:"It's tropical, so it's warm almost all year, with a rainy season and a dry season. My city is a bit cooler because it's in the highlands, which I really appreciate."},
    {q:"Part 1. Do you prefer hot or cold weather?", m:"I'd choose slightly cool weather. Very hot days make it hard to concentrate, but I've never experienced a real winter, so I might change my mind if I did."},
    {q:"Part 1. Does the weather affect your mood?", m:"Definitely. Rainy afternoons make me want to stay in and read, while sunny mornings give me more energy to go out and be productive."},
    {q:"Part 2. Describe a skill you would like to learn. You should say: what the skill is, why you want to learn it, how you would learn it, and explain how it would help you. (1 minute to prepare, 2 minutes to speak)", m:"One skill I'd really like to learn is sign language, specifically Indonesian Sign Language. The idea came to me during a hospital visit, when I saw a deaf patient struggling to explain her symptoms to a doctor, and the family member who was helping her was clearly exhausted. It made me realise how isolating it must be when you can't communicate with the people who are supposed to help you.\n\nIf I had the time, I'd start with an online beginner course, because there are some free video lessons made by deaf teachers. After that, I'd like to join a local community group, since you can't really learn a language just from videos; you need to use it with real people.\n\nI think it would help me in two ways. Professionally, it would make me a better doctor, because I could talk to deaf patients directly, which is more respectful and probably safer. Personally, learning a visual language would be a completely new challenge, and after learning English I've become quite curious about how different languages work."},
    {q:"Part 3. Which skills do you think are most important for young people today?", m:"I'd say adaptability and communication. Jobs are changing so quickly that what you learn at university may be out of date in ten years, so being able to learn new things is crucial. And whatever the job, you need to explain your ideas clearly and work with other people."},
    {q:"Part 3. Should practical skills be taught at school, or only academic subjects?", m:"I think schools should do both. Academic subjects build thinking skills, but students also need practical abilities like managing money, cooking or basic first aid. Many adults leave school without knowing how to do these things, which seems like a gap in the system."},
    {q:"Part 3. Is it easier for adults or children to learn new skills?", m:"In some areas children have an advantage, for example pronunciation in a new language. But adults have strengths too: they're more disciplined, they understand why they're learning, and they can use strategies. So I'd say it's different rather than harder."}]}

    q:"The graph below shows the number of international students (in thousands) enrolled at universities in three countries between 2005 and 2025. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
    chart:{type:"line", unit:"thousands of students", x:["2005","2010","2015","2020","2025"], s:[["Country A",[120,150,210,180,260]],["Country B",[200,220,230,240,245]],["Country C",[40,60,95,110,170]]]},
    m:"The line graph shows changes in the number of international students at universities in three countries over a twenty-year period.\n\nOverall, all three countries saw an increase, but Country A experienced the most dramatic and the most uneven growth, eventually overtaking Country B as the most popular destination. Country C, although starting from a low base, more than quadrupled its numbers.\n\nIn 2005, Country B attracted the most international students, at 200,000, compared with 120,000 in Country A and only 40,000 in Country C. Country B then grew slowly and steadily, reaching 245,000 by 2025.\n\nCountry A's figures rose rapidly to 210,000 in 2015 before falling to 180,000 in 2020. However, they then surged to 260,000 by the end of the period, the highest figure on the graph. Country C showed continuous growth throughout, with the fastest rise in the final five years, from 110,000 to 170,000.",
    phr:["the most uneven growth","starting from a low base","more than quadrupled","surged to","throughout"]},
  T25:{task:2, min:40, words:250, type:"Opinion (agree/disagree)", t:"Task 2 · Opinion: sports facilities & public health",
    q:"Some people think that the best way to improve public health is to increase the number of sports facilities. Others, however, say that this would have little effect and that other measures are needed. To what extent do you agree or disagree that more sports facilities are the best way to improve public health?",
    plan:"Posisi: sebagian setuju (fasilitas membantu, tapi BUKAN cara terbaik). Body 1: kenapa fasilitas membantu (akses, murah) + contoh. Body 2: kenapa bukan yang terbaik: penyebab utama penyakit = pola makan, rokok, sanitasi, layanan kesehatan dasar + contoh. Kesimpulan: kombinasi, prioritas pencegahan.",
    m:"It is often argued that building more sports facilities is the most effective way to make a population healthier. While I accept that greater access to places to exercise can bring real benefits, I disagree that it is the best approach, because many of the most serious health problems have causes that sports centres cannot address.\n\nThere is no doubt that sports facilities can play a positive role. When parks, swimming pools and affordable gyms are available close to people's homes, regular exercise becomes easier and cheaper, which particularly benefits low-income families. Physical activity is known to reduce the risk of conditions such as obesity, type 2 diabetes and heart disease, so making it more accessible is a sensible investment. In some cities, for example, free outdoor gyms in public parks have encouraged older adults to stay active.\n\nHowever, facilities alone do not guarantee that people will use them, and they do little to tackle other major risk factors. A large proportion of chronic disease is linked to diet, smoking and alcohol, and in many developing countries basic problems such as poor sanitation and limited access to primary care still cause a heavy burden of illness. A new stadium will not prevent a child from getting diarrhoea from unsafe water, nor will it persuade a heavy smoker to quit. Measures such as taxing sugary drinks, running anti-smoking campaigns and strengthening local clinics are likely to have a much broader impact.\n\nIn conclusion, although more sports facilities can contribute to better public health, I do not believe they are the best solution. Governments should treat them as one part of a wider strategy that focuses on prevention, healthy environments and access to basic healthcare.",
    phr:["While I accept that …, I disagree that …","There is no doubt that … can play a positive role","a sensible investment","do little to tackle","a heavy burden of illness","one part of a wider strategy"]},
  T26:{task:2, min:40, words:250, type:"Discuss both views + opinion", t:"Task 2 · Discussion: when children should learn a foreign language",
    q:"Some people believe that children should start learning a foreign language at primary school. Others think it is better to wait until secondary school. Discuss both views and give your own opinion.",
    plan:"Body 1: alasan mulai di SD (otak lebih plastis, pronunciation, tanpa takut salah) + contoh. Body 2: alasan tunggu SMP (fokus bahasa ibu & literasi dasar, guru SD kurang terlatih, remaja belajar lebih efisien) + contoh. Opini: mulai di SD TAPI dengan syarat guru kompeten & metode bermain.",
    m:"There is ongoing debate about the ideal age for children to begin studying a foreign language. While some people support introducing it at primary school, others argue that it should be delayed until secondary school. In my view, an early start is beneficial, provided that it is taught well.\n\nThose in favour of an early start point out that young children seem to acquire languages naturally. They are generally better at imitating new sounds, so they are more likely to develop accurate pronunciation, and they tend to be less anxious about making mistakes than teenagers. Furthermore, starting early simply gives learners more years of exposure. A child who begins English at the age of seven, for instance, will have studied it for over ten years by the time they finish school.\n\nOn the other hand, there are reasonable arguments for waiting. Primary school is when children build basic literacy and numeracy in their first language, and some educators worry that adding another language may overload them. In addition, many primary schools lack teachers who are confident in the foreign language, and poor teaching can do more harm than good. Older learners also have more developed thinking skills, which allows them to make faster progress in a shorter time.\n\nOverall, I believe the advantages of starting at primary school outweigh the drawbacks, but only if lessons are age-appropriate, based on songs, stories and games rather than grammar rules, and delivered by trained teachers. If these conditions cannot be met, it may indeed be more effective to concentrate resources on secondary school.",
    phr:["There is ongoing debate about","Those in favour of … point out that","provided that","can do more harm than good","On the other hand, there are reasonable arguments for","the advantages … outweigh the drawbacks"]},
  T27:{task:2, min:40, words:250, type:"Causes & solutions", t:"Task 2 · Problem/solution: sedentary city life",
    q:"In many cities, people now spend more time sitting and less time being physically active than in the past. What are the causes of this problem, and what measures could be taken to solve it?",
    plan:"Body 1 (sebab): kerja kantor/kuliah di depan layar, transportasi motor/mobil & kota tidak ramah pejalan kaki, hiburan digital. Body 2 (solusi): desain kota (trotoar, jalur sepeda), kebijakan tempat kerja (meja berdiri, istirahat aktif), sekolah & kampanye. Kesimpulan.",
    m:"Modern urban lifestyles have become increasingly sedentary, with many people spending most of their waking hours sitting down. This essay will examine the main reasons for this trend and suggest some practical ways to address it.\n\nThe most obvious cause is the nature of modern work and study. A growing number of jobs are office-based and computer-driven, and students, too, spend long hours in front of laptops. A second factor is transport. In many cities, especially in Asia, people rely on cars and motorbikes even for short journeys, partly because pavements are narrow, broken or simply absent, which makes walking unpleasant and sometimes dangerous. Finally, leisure time has also moved indoors: streaming services, online games and social media now compete directly with outdoor activities.\n\nTackling this problem requires action at several levels. Firstly, city planners can make active travel the easy choice by building safe pavements, shaded walkways and protected cycle lanes, as cities such as Copenhagen have done with great success. Secondly, employers and universities can reduce sitting time by introducing standing desks, encouraging short movement breaks and holding walking meetings. Thirdly, schools should give children daily physical activity so that being active becomes a lifelong habit, while public campaigns can remind adults that even small changes, such as taking the stairs, make a measurable difference to health.\n\nIn conclusion, sedentary behaviour is mainly the result of desk-based work, car-dependent cities and screen-based entertainment. By redesigning urban spaces, changing workplace culture and building habits from childhood, governments and organisations can help city dwellers lead more active lives.",
    phr:["increasingly sedentary","This essay will examine","A growing number of","make active travel the easy choice","Tackling this problem requires action at several levels","make a measurable difference to"]},
  T28:{task:2, min:40, words:250, type:"Advantages vs disadvantages", t:"Task 2 · Online medical information",
    q:"More and more people search the internet for medical information instead of seeing a doctor. Do the advantages of this development outweigh the disadvantages?",
    plan:"Posisi: kerugian lebih besar (kalau MENGGANTIKAN dokter). Body 1 (keuntungan): akses cepat & murah, pasien lebih paham & bisa bertanya lebih baik, info pencegahan. Body 2 (kerugian, lebih berat): misinformasi, self-diagnosis salah → terlambat berobat, kecemasan (cyberchondria). Kesimpulan: internet sebagai pelengkap, bukan pengganti.",
    m:"Nowadays, many people turn to the internet when they feel unwell rather than making an appointment with a doctor. Although online health information has some clear benefits, I believe that its disadvantages are greater when it is used as a replacement for professional care.\n\nOn the positive side, the internet has made health information accessible to almost everyone. People can quickly learn about common conditions, find advice on prevention, and decide whether a symptom is likely to need urgent attention. Reliable websites run by hospitals or health authorities can also help patients understand their diagnosis and prepare better questions before an appointment, which can lead to more productive consultations. For people in remote areas, this information may be the only resource available at short notice.\n\nHowever, the risks are considerable. Much of the medical content online is inaccurate or deliberately misleading, and it is difficult for non-specialists to distinguish evidence-based advice from marketing or personal opinion. More seriously, self-diagnosis can be dangerous. A person who reads that their chest pain is probably caused by stress may delay seeking help for a heart problem, while others may become extremely anxious, convinced that a mild headache is a brain tumour, a phenomenon sometimes called 'cyberchondria'. Some people also buy medicines online without a prescription, which can cause harmful side effects or interactions.\n\nIn conclusion, the internet can be a valuable source of general health knowledge, but because of the danger of misinformation and incorrect self-diagnosis, the drawbacks outweigh the benefits when people use it instead of seeing a doctor. It should complement, not replace, professional medical advice.",
    phr:["turn to the internet","On the positive side","at short notice","the risks are considerable","distinguish evidence-based advice from","It should complement, not replace"]},
  MK2:{task:2, min:40, words:250, type:"Opinion (agree/disagree)", t:"Mock · Task 2 · Online learning",
    q:"Some people believe that online learning will eventually replace traditional classroom teaching. To what extent do you agree or disagree?",
    plan:"Posisi: tidak setuju sepenuhnya (blended). Body 1: kelebihan online (fleksibel, murah, akses) → akan tumbuh. Body 2: kenapa tidak menggantikan (interaksi sosial, praktik langsung mis. kedokteran, motivasi & disiplin, kesenjangan internet). Kesimpulan: model campuran.",
    m:"With the rapid growth of online courses and video lectures, some people predict that traditional classrooms will soon disappear. Although I agree that online learning will continue to expand, I do not believe it will completely replace face-to-face teaching.\n\nThere are strong reasons why online education is becoming more popular. It is flexible, allowing students to learn at their own pace and from any location, which is ideal for working adults or those living far from universities. It can also be cheaper, and it gives learners access to world-class teachers and resources that would otherwise be unavailable. During the COVID-19 pandemic, for example, millions of students continued their education entirely online, proving that it can work on a large scale.\n\nNevertheless, classrooms offer things that are difficult to reproduce on a screen. Learning is a social process: discussing ideas with classmates, asking questions spontaneously and receiving immediate feedback all help students understand more deeply. In addition, many subjects require hands-on practice. Medical students, for instance, cannot learn to examine a patient or perform a procedure just by watching videos. Finally, online learning demands a high level of self-discipline, and many students, especially younger ones, find it hard to stay motivated without the structure of a timetable and the presence of a teacher.\n\nIn conclusion, online learning is likely to become an increasingly important part of education, but I disagree that it will replace classroom teaching altogether. The most probable future is a blended model, in which digital tools support, rather than substitute for, learning in person.",
    phr:["With the rapid growth of","learn at their own pace","on a large scale","Nevertheless, … offer things that are difficult to reproduce","hands-on practice","support, rather than substitute for"]}
};

const SUMMARIES_BUILTIN = [
{
  id:"sn-anak", lecture:null, title:"Sindrom Nefrotik pada Anak", updated:"2026-10-23",
  note:"Format rangkuman penyakit: 0. dasar normal → 1–15 struktur penyakit. Materi pelengkap pediatri (tidak terikat satu KUL), dilengkapi dari pedoman. Begitu PPT-nya dikirim, aku cocokkan dan tandai bagian yang beda.",
  sections:[
    {lvl:"Peta", h:"0.1. Gambaran besar dalam 30 detik", html:"<p>Sindrom nefrotik (SN) = <b>saringan ginjal bocor</b>, sehingga protein (terutama albumin) ikut keluar lewat urin dalam jumlah besar. Akibatnya kadar albumin darah turun, cairan merembes ke jaringan (bengkak), dan hati \"panik\" membuat lemak lebih banyak.</p><div class='box key'><b class='lab'>Rumus 4 serangkai</b><p>[[proteinuria masif]] + [[hipoalbuminemia]] + edema + [[hiperlipidemia]]</p></div><p>Pada anak, penyebab tersering adalah SN idiopatik dengan gambaran [[lesi minimal]], dan sebagian besar <b>respons baik dengan steroid</b>.</p>"},
    {lvl:"Dasar", h:"0.2. Fisiologi normal: saringan glomerulus", html:"<p>Darah disaring di glomerulus melewati 3 lapis saringan: (1) endotel kapiler yang berlubang-lubang ([[fenestrata]]), (2) [[membran basal glomerulus]] yang bermuatan negatif, dan (3) celah antar \"kaki\" [[podosit]] yang ditutup [[slit diaphragm]] (protein utamanya nefrin dan podosin).</p><p>Normalnya albumin hampir tidak lolos karena ukurannya besar dan muatannya negatif (ditolak muatan negatif membran basal).</p><div class='box clin'><b class='lab'>Hubungannya</b><p>Pada SN lesi minimal, kaki-kaki podosit \"meleleh\" dan merata ([[foot process effacement]]). Di mikroskop cahaya glomerulus tampak normal, kelainannya hanya terlihat dengan mikroskop elektron.</p></div><p class='small muted'>Lihat diagram nefron interaktif di menu Anat · Histo · Fisio.</p>"},
    {lvl:"Definisi", h:"1. Definisi", html:"<p>Sindrom nefrotik (SN) adalah <b>kumpulan gejala</b> (sindrom = kumpulan gejala, bukan satu penyakit tunggal) akibat kebocoran saringan glomerulus terhadap protein.</p><p><b>1.1. Kriteria diagnosis (IDAI 2012)</b></p><div class='tbl'><table><tr><th>Komponen</th><th>Batas pada anak</th></tr><tr><td>[[Proteinuria masif]]</td><td>&gt; 40 mg/m²/jam, atau rasio protein/kreatinin urin sewaktu &gt; 2 mg/mg, atau dipstik ≥ 2+</td></tr><tr><td>[[Hipoalbuminemia]]</td><td>Albumin serum &lt; 2,5 g/dL</td></tr><tr><td>Edema</td><td>Bengkak, bisa sampai [[edema anasarka]]</td></tr><tr><td>Hiperkolesterolemia</td><td>Dapat disertai, kolesterol &gt; 200 mg/dL</td></tr></table></div><p class='small muted'>Kenapa pakai rasio protein/kreatinin? Karena menampung urin 24 jam pada anak kecil itu sulit. Kreatinin keluar relatif konstan, jadi bisa dipakai sebagai \"penggaris\".</p>"},
    {lvl:"Epidemiologi", h:"2. Epidemiologi", html:"<ul><li>Penyakit glomerulus <b>tersering pada anak</b>.</li><li>Insidens sekitar 2–7 kasus per 100.000 anak per tahun di berbagai negara (lebih tinggi pada keturunan Asia Selatan).</li><li>Puncak onset usia <b>2–6 tahun</b>; pada usia muda laki-laki ± 2× lebih sering dari perempuan.</li><li>Sekitar 80–90% SN idiopatik anak <b>sensitif steroid</b>, dan sebagian besar dari mereka akan mengalami relaps setidaknya sekali.</li></ul><div class='box trap'><b class='lab'>Jebakan</b><p>Perbandingan laki-laki : perempuan 2 : 1 hanya berlaku pada anak kecil. Pada remaja dan dewasa perbandingannya hampir sama.</p></div>"},
    {lvl:"Etiologi", h:"3. Etiologi", html:"<p><b>3.1. Idiopatik (primer)</b>: penyebab pasti belum diketahui. Paling sering pada anak.</p><p><b>3.2. Sekunder</b>: akibat penyakit lain yang merusak glomerulus.</p><ul><li>Infeksi: hepatitis B, HIV, malaria, sifilis kongenital</li><li>Autoimun/vaskulitis: lupus (LES), purpura Henoch-Schönlein (vaskulitis IgA)</li><li>Obat dan toksin: OAINS, merkuri</li><li>Keganasan: limfoma</li></ul><p><b>3.3. Genetik/kongenital</b>: mutasi gen protein podosit, misalnya NPHS1 (nefrin) pada SN kongenital tipe Finlandia, NPHS2 (podosin) pada sebagian SN resisten steroid.</p>"},
    {lvl:"Klasifikasi", h:"4. Klasifikasi", html:"<p><b>4.1. Berdasarkan usia onset</b></p><ul><li>Kongenital: &lt; 3 bulan</li><li>Infantil: 3–12 bulan</li><li>Anak: &gt; 1 tahun (tersering)</li></ul><p><b>4.2. Berdasarkan histopatologi</b></p><ul><li>[[Lesi minimal]] (MCD): tersering pada anak (± 3/4 kasus pada studi ISKDC)</li><li>[[FSGS]]</li><li>Glomerulonefritis membranoproliferatif, nefropati membranosa, dll.</li></ul><p><b>4.3. Berdasarkan respons steroid (paling dipakai di klinik)</b></p><ul><li>Sensitif steroid: remisi dalam 4 minggu steroid dosis penuh</li><li>[[SN resisten steroid]]: tidak remisi setelah 4 minggu dosis penuh (IPNA 2023 menambah periode konfirmasi sebelum menyebut resisten)</li><li>Relaps jarang vs relaps sering: relaps sering = ≥ 2 kali dalam 6 bulan pertama setelah respons awal atau ≥ 4 kali dalam 1 tahun</li><li>Dependen steroid: relaps 2 kali berturut-turut saat dosis alternating atau dalam 14 hari setelah steroid dihentikan</li></ul>"},
    {lvl:"Faktor risiko", h:"5. Faktor risiko", html:"<ul><li>Usia 1–10 tahun, laki-laki</li><li>Keturunan Asia (terutama Asia Selatan)</li><li>Riwayat atopi (alergi) pada sebagian anak</li><li>Mutasi genetik podosit (untuk bentuk kongenital/resisten)</li><li>Infeksi yang mendasari (hepatitis B, HIV, malaria) untuk bentuk sekunder</li></ul><div class='box clin'><b class='lab'>Pemicu relaps</b><p>Infeksi saluran napas atas sering mendahului relaps. Itu sebabnya edukasi pencegahan infeksi penting.</p></div>"},
    {lvl:"Patofisiologi", h:"6. Patofisiologi", html:"<p><b>6.1. Pemicu di tingkat sel</b></p><ul><li>Pada lesi minimal, diduga ada gangguan sistem imun (limfosit T dan B) yang melepaskan [[faktor permeabilitas]] atau membuat antibodi.</li><li>Temuan baru: pada sebagian anak ditemukan <b>antibodi anti-nefrin</b>, yaitu antibodi yang menyerang nefrin di slit diaphragm (Hengel dkk., NEJM 2024).</li></ul><p><b>6.2. Dari molekul ke saringan bocor</b></p><div class='flow'><span class='node'>Sinyal imun / anti-nefrin</span><span class='arr'>→</span><span class='node'>Sitoskeleton aktin podosit berubah</span><span class='arr'>→</span><span class='node'>[[Foot process effacement]]</span><span class='arr'>→</span><span class='node'>Slit diaphragm rusak + muatan negatif hilang</span><span class='arr'>→</span><span class='node'>Albumin lolos</span></div><p><b>6.3. Dari bocor ke bengkak</b></p><div class='flow'><span class='node'>Albumin keluar lewat urin</span><span class='arr'>→</span><span class='node'>Albumin darah ↓</span><span class='arr'>→</span><span class='node'>[[Tekanan onkotik]] ↓</span><span class='arr'>→</span><span class='node'>Air pindah ke jaringan</span><span class='arr'>→</span><span class='node'>Edema</span></div><ul><li><b>[[Underfill]]</b>: volume pembuluh turun → RAAS dan ADH aktif → ginjal menahan garam dan air.</li><li><b>[[Overfill]]</b>: ginjal menahan natrium secara primer (enzim protease di urin mengaktifkan ENaC di duktus koligens), volume pembuluh normal/naik.</li></ul><p><b>6.4. Kenapa kolesterol naik?</b> Hati \"panik\" karena albumin rendah, lalu membuat banyak protein termasuk lipoprotein (pembawa kolesterol). Enzim pemecah lemak (lipoprotein lipase) juga berkurang.</p><p><b>6.5. Kenapa darah gampang membeku?</b> Antitrombin III (protein \"rem\" pembekuan) ikut bocor lewat urin, sementara hati membuat lebih banyak fibrinogen dan faktor pembekuan → [[hiperkoagulasi]].</p><p><b>6.6. Kenapa gampang infeksi?</b> IgG dan faktor komplemen ikut bocor, ditambah efek steroid dan cairan asites yang jadi \"kolam\" kuman.</p>"},
    {lvl:"Klinis", h:"7. Manifestasi klinis", html:"<ul><li><b>Bengkak kelopak mata saat bangun tidur</b> → karena saat berbaring cairan berkumpul di jaringan longgar wajah.</li><li>Siang hari bengkak pindah ke tungkai → efek gravitasi.</li><li>Perut membesar ([[asites]]), bengkak skrotum/labia → cairan mengisi rongga dan jaringan longgar.</li><li><b>Urin berbuih</b> → protein di urin menurunkan tegangan permukaan seperti sabun.</li><li>Berat badan naik → bukan gemuk, tapi air.</li><li>Pada lesi minimal: biasanya tekanan darah normal dan tidak ada hematuria makroskopik.</li><li>Tanda bahaya: nyeri perut + demam (curiga peritonitis), sesak (efusi pleura), tangan-kaki dingin + nadi cepat (hipovolemia).</li></ul>"},
    {lvl:"Diagnosis", h:"8. Alur penegakan diagnosis", html:"<div class='flow'><span class='node'>Anak edema</span><span class='arr'>→</span><span class='node'>Dipstik urin: protein ≥ 2+</span><span class='arr'>→</span><span class='node'>Rasio protein/kreatinin urin &gt; 2 mg/mg</span><span class='arr'>→</span><span class='node'>Albumin &lt; 2,5 g/dL (± kolesterol tinggi)</span><span class='arr'>→</span><span class='node'>SN tegak</span></div><p><b>8.1. Lalu tentukan tipikal atau tidak</b></p><ul><li><b>Tipikal</b> (arah lesi minimal): usia 1–10 th, tanpa hematuria makroskopik, tekanan darah normal, C3 normal, fungsi ginjal normal → mulai steroid tanpa biopsi.</li><li><b>Tidak tipikal</b>: usia &lt; 1 th, hematuria nyata, hipertensi menetap, C3 rendah, kreatinin naik, atau tidak respons steroid → rujuk ke nefrologi anak, pertimbangkan biopsi.</li></ul>"},
    {lvl:"DD", h:"9. Diagnosis banding", html:"<div class='tbl'><table><tr><th>Diagnosis</th><th>Clue pembeda</th></tr><tr><td>Sindrom nefritik (GNAPS)</td><td>Hematuria/urin seperti teh, hipertensi, oliguria, riwayat faringitis/impetigo 1–3 minggu sebelumnya, C3 rendah</td></tr><tr><td>Gagal jantung</td><td>Sesak, ortopnea, hepatomegali, peningkatan JVP, proteinuria tidak masif</td></tr><tr><td>Penyakit hati kronik</td><td>Ikterus, stigmata hati, albumin rendah tanpa proteinuria</td></tr><tr><td>Malnutrisi (kwashiorkor)</td><td>Asupan buruk, kelainan kulit dan rambut, tanpa proteinuria</td></tr><tr><td>Protein-losing enteropathy</td><td>Diare kronik, albumin rendah tanpa proteinuria</td></tr><tr><td>Angioedema/alergi</td><td>Mendadak, gatal/urtikaria, proteinuria negatif</td></tr></table></div><div class='box key'><b class='lab'>Kunci</b><p>Albumin rendah + edema tapi proteinuria negatif → bukan SN. Cari masalah di hati, usus, atau gizi.</p></div>"},
    {lvl:"Penunjang", h:"10. Pemeriksaan penunjang", html:"<ul><li><b>Urin</b>: urinalisis (protein, eritrosit, silinder), rasio protein/kreatinin urin sewaktu (atau urin 24 jam bila bisa).</li><li><b>Darah</b>: albumin, kolesterol/profil lipid, ureum-kreatinin, elektrolit, darah lengkap.</li><li><b>Untuk mencari penyebab atau atipikal</b>: C3 (C4, ANA bila curiga lupus), HBsAg, anti-HCV, HIV sesuai indikasi.</li><li><b>Sebelum steroid jangka panjang</b>: uji tuberkulin di daerah endemis TB.</li><li><b>Biopsi ginjal</b>: tidak rutin; untuk SN resisten steroid, onset &lt; 1 tahun, atau gambaran tidak tipikal.</li></ul>"},
    {lvl:"Farmako", h:"11. Tatalaksana farmakologis", html:"<p><b>11.1. Steroid inisial (IDAI 2012, berdasar ISKDC)</b></p><ol><li>Prednison <b>60 mg/m²/hari</b> (atau 2 mg/kgBB/hari), maksimal 80 mg/hari, dosis terbagi, selama <b>4 minggu</b>.</li><li>Lanjut <b>40 mg/m²</b> (2/3 dosis awal) [[dosis alternating]], dosis tunggal pagi, selama <b>4 minggu</b>.</li></ol><p class='small muted'>Dosis dihitung dari [[LPB]] supaya anak yang berat badannya naik karena edema tidak kelebihan dosis.</p><p><b>11.2. Relaps</b>: prednison dosis penuh sampai remisi, lalu dilanjutkan dosis alternating 4 minggu (IDAI 2012).</p><p><b>11.3. Relaps sering, dependen, atau resisten steroid</b>: obat hemat steroid seperti siklofosfamid, levamisol, inhibitor kalsineurin (siklosporin, takrolimus), mikofenolat, rituksimab. Diputuskan oleh dokter spesialis anak konsultan nefrologi.</p><p><b>11.4. Edema</b>: diuretik (furosemid ± spironolakton) dengan hati-hati karena bisa memperberat hipovolemia. Infus albumin 20–25% hanya untuk edema berat/refrakter atau hipovolemia, diikuti furosemid.</p><p><b>11.5. Proteinuria menetap / SN resisten</b>: ACE inhibitor atau ARB untuk menurunkan proteinuria.</p><div class='box trap'><b class='lab'>Jebakan dosis</b><p>60 mg/m²/hari (fase harian) vs 40 mg/m² alternating (fase lanjutan); 4 minggu + 4 minggu. IPNA 2023 dan KDIGO 2021 memakai pola serupa dengan batas maksimal dosis yang sedikit berbeda. Untuk ujian, ikuti versi PPT dosen, dan tanya dosen kalau berbeda.</p></div>"},
    {lvl:"Non-farmako", h:"12. Tatalaksana non-farmakologis", html:"<ul><li><b>Diet protein normal</b> sesuai kebutuhan (IDAI: 1,5–2 g/kgBB/hari). Diet tinggi protein tidak dianjurkan karena menambah beban kerja glomerulus tanpa menaikkan albumin.</li><li><b>Rendah garam</b> (1–2 g/hari) hanya selama edema.</li><li>Tirah baring tidak perlu dipaksakan; aktivitas sesuai kemampuan anak.</li><li>Pantau berat badan, tekanan darah, dan dipstik urin harian selama fase aktif.</li><li>Rawat inap bila edema berat, curiga infeksi berat, hipovolemia, atau untuk edukasi awal.</li></ul>"},
    {lvl:"KIE", h:"13. KIE (komunikasi, informasi, edukasi)", html:"<ul><li>SN adalah penyakit yang <b>bisa kambuh</b>; kebanyakan anak membaik dan fungsi ginjalnya tetap baik bila sensitif steroid.</li><li>Ajari orang tua <b>cek dipstik urin pagi</b> di rumah dan mencatatnya di buku harian.</li><li>Steroid <b>tidak boleh dihentikan mendadak</b>; minum pagi hari untuk dosis alternating.</li><li>Jelaskan efek samping steroid: wajah bulat (Cushingoid), nafsu makan naik, perubahan mood, tekanan darah naik, gangguan tumbuh bila jangka panjang.</li><li>Tanda harus segera ke dokter: demam, nyeri perut, sesak, bengkak makin berat, jarang kencing, lemas/dingin.</li></ul>"},
    {lvl:"Pencegahan", h:"14. Pencegahan", html:"<ul><li>SN idiopatik belum bisa dicegah, jadi fokusnya <b>mencegah relaps dan komplikasi</b>.</li><li>Cegah infeksi: cuci tangan, hindari kontak dengan anak sakit saat dosis steroid tinggi.</li><li>Vaksinasi: pneumokokus dan influenza dianjurkan; vaksin hidup ditunda selama steroid dosis tinggi dan beberapa waktu setelahnya (ikuti jadwal IDAI).</li><li>Deteksi dini relaps dengan dipstik rutin supaya terapi dimulai sebelum edema berat.</li></ul>"},
    {lvl:"Komplikasi", h:"15. Komplikasi", html:"<ul><li><b>Infeksi</b>: [[peritonitis bakterial spontan]] (tersering <i>Streptococcus pneumoniae</i>), selulitis, sepsis.</li><li><b>Trombosis</b>: vena renalis, vena dalam, sinus vena serebral.</li><li><b>Hipovolemia</b> sampai syok, terutama setelah diuretik atau diare.</li><li><b>Gangguan ginjal akut</b>.</li><li><b>Hiperlipidemia</b> jangka panjang.</li><li><b>Efek samping steroid</b>: Cushingoid, hipertensi, gangguan tumbuh, osteoporosis, katarak.</li><li>Hipokalsemia (protein pengikat vitamin D ikut bocor), hipotiroid ringan (protein pengikat tiroid ikut bocor).</li></ul>"},
    {lvl:"Ringkas", h:"16. Ringkasan 1 menit sebelum ujian", html:"<ul><li>4 serangkai: proteinuria masif, albumin &lt; 2,5, edema, kolesterol tinggi.</li><li>Anak 1–10 th tersering lesi minimal: mikroskop cahaya normal, effacement di mikroskop elektron, sensitif steroid.</li><li>Prednison 60 mg/m²/hari 4 minggu → 40 mg/m² alternating 4 minggu.</li><li>Komplikasi: infeksi (peritonitis S. pneumoniae), trombosis, hipovolemia, efek samping steroid.</li></ul>"}
  ],
  glossary:{
    "proteinuria masif":"Protein keluar lewat urin dalam jumlah sangat banyak (pada anak > 40 mg/m²/jam).",
    "hipoalbuminemia":"Kadar albumin dalam darah rendah. Hipo = kurang, -emia = dalam darah.",
    "hiperlipidemia":"Kadar lemak (kolesterol/trigliserida) darah tinggi.",
    "lesi minimal":"Minimal change disease. Glomerulus tampak normal di mikroskop cahaya, kelainan hanya di mikroskop elektron (kaki podosit merata).",
    "fenestrata":"Berlubang-lubang seperti jendela kecil (fenestra = jendela).",
    "membran basal glomerulus":"Lapisan tipis di antara endotel dan podosit, bermuatan negatif, bagian tengah saringan ginjal.",
    "podosit":"Sel epitel berkaki-kaki yang membungkus kapiler glomerulus. Celah antar kakinya jadi saringan terakhir.",
    "slit diaphragm":"Membran tipis penutup celah antar kaki podosit, tersusun dari protein nefrin, podosin, dll.",
    "foot process effacement":"Kaki-kaki podosit menyatu/merata sehingga saringan rusak. Tanda khas lesi minimal di mikroskop elektron.",
    "edema anasarka":"Bengkak menyeluruh di seluruh tubuh.",
    "FSGS":"Focal segmental glomerulosclerosis: sebagian (fokal) glomerulus mengalami parut (sklerosis) pada sebagian segmennya. Lebih sering resisten steroid.",
    "tekanan onkotik":"Tekanan yang \"menarik\" air ke dalam pembuluh darah, terutama dibuat oleh albumin.",
    "underfill":"Teori edema: pembuluh darah \"kurang isi\" sehingga tubuh mengaktifkan hormon penahan air dan garam.",
    "overfill":"Teori edema: ginjal menahan garam secara primer sehingga pembuluh darah \"kelebihan isi\".",
    "hiperkoagulasi":"Darah lebih mudah membeku dari normal.",
    "peritonitis bakterial spontan":"Infeksi cairan asites di rongga perut tanpa sumber infeksi yang jelas.",
    "asites":"Penumpukan cairan di rongga perut.",
    "SN resisten steroid":"Sindrom nefrotik yang tidak mencapai remisi setelah steroid dosis penuh 4 minggu.",

  {topic:"Fisiologi", stem:"Pada orang sehat, tekanan arteri rata-rata naik dari 100 ke 140 mmHg, tetapi laju filtrasi glomerulus hampir tidak berubah. Salah satu mekanismenya dimulai dari meningkatnya NaCl yang tiba di macula densa.\nRespons yang paling tepat setelah macula densa mendeteksi peningkatan NaCl adalah…",

  {topic:"Fisiologi", stem:"Seorang mahasiswa melakukan uji klirens inulin. Didapatkan kadar inulin urin 100 mg/mL, kadar inulin plasma 1 mg/mL, dan laju aliran urin 1,2 mL/menit.\nLaju filtrasi glomerulus mahasiswa tersebut adalah…",

  {topic:"Farmakologi", stem:"Perempuan 66 tahun dengan overactive bladder, mengeluh urgensi dan sering BAK malam. Ia memiliki riwayat glaukoma sudut tertutup sehingga dokter menghindari antimuskarinik. Dokter memilih obat yang bekerja pada reseptor yang secara fisiologis diaktifkan saraf hipogastrikus untuk merelaksasi otot detrusor saat fase pengisian.\nObat tersebut adalah golongan…",

const LS_KEY = "nadia-ruang-belajar-v1";
const CLIENT = Math.random().toString(36).slice(2);
function freshState(){
  return {v:1, updatedAt:0, by:"", activeBlock:"uro",
    blocks: JSON.parse(JSON.stringify(BLOCKS_DEFAULT)),
    lectures: JSON.parse(JSON.stringify(LECTURES_DEFAULT)),
    steps:{}, slides:{}, conf:{}, quiz:{}, drafts:{}, times:{}, ack:{}, library:[], wins:[], why:"", watched:{}, caseNotes:{}, maxPerDay:4};
}
let S = freshState();

function lsGet(){ try{ const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function lsSet(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }
function merge(base, inc){ const out = Object.assign(freshState(), base, inc); addNewLectures(out); return out; }
/* KUL baru di LECTURES_DEFAULT ikut masuk ke data lama, kecuali yang pernah dihapus */
const LEC_REV = 5;
function addNewLectures(st){
  if (!st.seenLec) st.seenLec = (st.lectures||[]).map(l => l.id);
  /* rev 2: KUL 9-24 disamakan dengan nomor PDF 2026 */
  if ((st.lecRev||0) < LEC_REV){
    LECTURES_DEFAULT.forEach(d => { if (d.block !== "uro" || d.no < 9) return; const l = (st.lectures||[]).find(x => x.id === d.id); if (l){ l.title = d.title; l.en = d.en; l.no = d.no; if (d.tent) l.tent = true; else delete l.tent; } });
    /* rev 3: blok uro cuma 23 KUL, KUL 24 dihapus */
    st.lectures = (st.lectures||[]).filter(l => l.id !== "k24");
    /* rev 4: KUL default yang hilang dari daftar (padahal sudah tercatat 'seen') dimasukkan lagi, kecuali yang sengaja dihapus */
    st.lectures = st.lectures || [];
    LECTURES_DEFAULT.forEach(d => { if (!st.lectures.some(l => l.id === d.id) && (st.delLec||[]).indexOf(d.id) < 0) st.lectures.push(JSON.parse(JSON.stringify(d))); });
    const OLD_DATES = {"k1": "2026-09-29", "k2": "2026-10-01", "k3": "2026-10-06", "k4": "2026-10-08", "k5": "2026-10-13", "k6": "2026-10-15", "k7": "2026-10-20", "k8": "2026-10-22"};
    LECTURES_DEFAULT.forEach(d => { const l = st.lectures.find(x => x.id === d.id); if (l && (!l.date || l.date === OLD_DATES[d.id])) l.date = d.date; });
    st.lectures.sort((x,y) => (x.block===y.block ? (x.no||0)-(y.no||0) : 0));
    st.lecRev = LEC_REV;
  }
  LECTURES_DEFAULT.forEach(d => { if (st.seenLec.indexOf(d.id) < 0){ if (!(st.lectures||[]).some(l => l.id === d.id)) st.lectures.push(JSON.parse(JSON.stringify(d))); st.seenLec.push(d.id); } });
  /* jadwal resmi Blok Repro (info PJMK 30 Okt, 2 & 3 Nov): tanggal perkiraan lama diganti, tanggal yang kamu edit sendiri tidak disentuh */
  if (!st.reproSched1){
    const OLD_R = {r1:"2026-11-02", r2:"2026-11-03", r3:"2026-11-04", r4:"2026-11-05", r5:"2026-11-06", r6:"2026-11-09", r7:"2026-11-10", r8:"2026-11-11", r9:"2026-11-12", r10:"2026-11-13"};
    LECTURES_DEFAULT.forEach(d => { if (d.block !== "repro") return; const l = (st.lectures||[]).find(x => x.id === d.id); if (!l) return;
      if (!l.date || l.date === OLD_R[d.id]) l.date = d.date; if (!l.dosen && d.dosen) l.dosen = d.dosen; if (d.ket) l.ket = d.ket; if (d.disc) l.disc = d.disc; if (d.tent) l.tent = true; else delete l.tent; });
    (st.blocks||[]).forEach(b => { if (b.id === "repro") b.tentative = false; });
    st.lectures.sort((x,y) => (x.block===y.block ? (x.no||0)-(y.no||0) : 0));
    st.reproSched1 = true;
  }
}

function save(){
  S.updatedAt = Date.now(); S.by = CLIENT;
  lsSet(S);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!stateRef) return;
    try { await stateRef.set(JSON.parse(JSON.stringify(S))); syncLabel = "tersimpan di akunmu"; }
    catch(e){ syncLabel = "gagal sinkron, tersimpan di browser"; }
    paintTop();
  }, 700);
}

async function initDb(){
  try{
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if (!db) return;
    stateRef = db.doc("nadia/state");
    const snap = await stateRef.get();
    if (snap.exists){
      const remote = snap.data();
      if ((remote.updatedAt||0) >= (S.updatedAt||0)) { S = merge(S, JSON.parse(JSON.stringify(remote))); lsSet(S); }
      else { await stateRef.set(JSON.parse(JSON.stringify(S))); }
    } else if (S.updatedAt) {
      await stateRef.set(JSON.parse(JSON.stringify(S)));
    }
    syncLabel = "tersimpan di akunmu";
    stateRef.onSnapshot(s => {
      if (!s.exists) return; const r = s.data();
      if (r.by !== CLIENT && (r.updatedAt||0) > (S.updatedAt||0)) { S = merge(S, JSON.parse(JSON.stringify(r))); lsSet(S); render(); }
    }, () => {});
    db.collection("konten").onSnapshot(qs => {
      const sums = [], qzs = [];
      qs.docs.forEach(d => { const x = d.data(); if (!x) return; if (x.type === "rangkuman") sums.push(Object.assign({id:d.id}, x)); if (x.type === "latsol") qzs.push(Object.assign({id:d.id}, x)); });
      extra = {summaries:sums, quizzes:qzs}; render();
    }, () => {});
    render();
  }catch(e){ /* tetap jalan dengan penyimpanan browser */ }
}

function addDays(s, n){ const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }

/* jadwal milestone bertingkat: Tengkurap dari tanggal KUL, tiap tahap berikutnya = tanggal tahap sebelumnya selesai (atau jadwalnya) + jeda.
   Yang telat hanya tahap pertama yang belum selesai; tahap sesudahnya ikut bergeser. Lalu diratakan maks maxPerDay per hari. */
/* MODE RINGAN: 3 tahap per KUL, maks 2 hal per hari, tanpa label "dikejar" */
const LITE = [
  {k:1, nm:"Baca & Paham", steps:[1,2,3], color:"var(--s1)", off:0, gap:0, what:"Baca rangkuman KUL ini selama 25 menit dan pahami keseluruhan PPT-nya. Tandai 1–3 hal yang bikin bingung, tanya GPT kalau perlu. Gak harus selesai sekali duduk."},
  {k:2, nm:"Latsol", steps:[4], color:"var(--s4)", gap:2, what:"Kerjakan latsol KUL ini. Salah itu bagus, justru dari situ nempelnya."},
  {k:3, nm:"Ulang yang salah", steps:[5], color:"var(--s5)", gap:5, what:"Review ulang materi KUL ini (rangkuman + PPT), lalu buka lagi soal yang tadi salah dan baca bagian rangkumannya."}
];
function liteDone(lid, k){ return LITE[k-1].steps.every(n => stepOf(lid, n).done); }
function liteQueue(){
  const t = todayISO(), out = [];
  lecs().filter(l => l.date).forEach(l => { let prev = null;
    for (const L of LITE) { const due = prev ? addDays(prev, L.gap) : addDays(l.date, L.off);
      if (liteDone(l.id, L.k)) { const ls = L.steps.map(n => stepOf(l.id, n).last).filter(Boolean).sort().pop(); prev = ls || due; continue; }
      out.push({lid:l.id, k:L.k, due, date:l.date}); break; } });
  return out.filter(x => x.due <= t).sort((a, b) => a.due.localeCompare(b.due) || a.k - b.k || a.date.localeCompare(b.date));
}

  '</div></div>';

function schedule(){
  const b = block(); const lastDay = b.uab ? addDays(b.uab, -1) : null;
  const load = {}; const out = []; const t = todayISO();
  lecs().filter(l => l.date).forEach(l => {
    let prev = null;
    STEPS.forEach(st => {
      const sp = stepOf(l.id, st.n);
      const orig = prev ? addDays(prev, st.gap) : addDays(l.date, st.off);
      if (sp.done){ const dd = sp.last || orig; out.push({lid:l.id, n:st.n, due:dd, orig, late:false}); prev = dd; return; }
      let d = orig < t ? t : orig; /* yang terlewat dijadwal ulang mulai hari ini */
      if (lastDay && d > lastDay && lastDay >= t) d = lastDay;
      let guard = 0;
      while ((load[d]||0) >= (S.maxPerDay||4) && guard < 10){ const nd = addDays(d, 1); if (lastDay && nd > lastDay) break; d = nd; guard++; }
      load[d] = (load[d]||0) + 1;
      out.push({lid:l.id, n:st.n, due:d, orig, late: orig < t});
      prev = d;
    });
  });
  return out;
}

function streak(){
  const days = new Set(); Object.values(S.steps).forEach(o => Object.values(o).forEach(v => { if (v && v.last) days.add(v.last); (v.hist||[]).forEach(h => days.add(h)); }));

}
