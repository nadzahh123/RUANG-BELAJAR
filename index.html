function discOf(l){
  if (l && l.disc && DISC[l.disc]) return l.disc;
  const t = ((l&&l.title)||"").toLowerCase();
  if (/mikro|parasit|bakteri|virolog|mikolog/.test(t)) return "mikro";
  if (/patologi anatomi|histopatolog|\bpa\b/.test(t)) return "pa";
  if (/patologi klinik|laborator|\bpk\b/.test(t)) return "pk";
  if (/farmako|obat/.test(t)) return "farmako";
  if (/radiolog|imaging|pencitraan|ultrasonograf|kardiotokograf/.test(t)) return "radiologi";
  if (l && l.block === "repro") return "penyakit";
  if (/diet|gizi|nutrisi/.test(t)) return "gizi";
  if (/etik|euthanasia|medikolegal|hukum|humaniora/.test(t)) return "etik";
  if (/anatomi|histologi|fisiologi|embriolog|biokimia/.test(t)) return "dasar";
  return "penyakit";
}

function slideRowsFor(l, ns){ return ns.map(n => { const st = STEPS[n-1], b = slideOf(l.id, n); const p = b.total ? Math.min(100, Math.round((b.at||0)/b.total*100)) : 0;
  return '<div class="row" style="gap:6px"><span class="small muted">Sudah sampai slide</span><input type="number" min="0" inputmode="numeric" style="width:70px;padding:4px 6px" data-slide="at" data-l="'+l.id+'" data-n="'+n+'" value="'+(b.at||"")+'" aria-label="Slide terakhir"><span class="small muted">dari</span><input type="number" min="1" inputmode="numeric" style="width:70px;padding:4px 6px" data-slide="total" data-l="'+l.id+'" data-n="'+n+'" value="'+(b.total||"")+'" aria-label="Total slide"><div class="meter" style="flex:1;min-width:60px"><i style="width:'+p+'%;background:'+st.color+'"></i></div><span class="mono small">'+(b.total?p+'%':'')+'</span></div>'; }).join(""); }
let timer = {end:0, h:null};
function timerText(){ if (!timer.end) return "00:00"; const s = Math.max(0, Math.round((timer.end - Date.now())/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function tickTimer(){ const el = $("#timerDisp"); if (el) el.textContent = timerText(); if (timer.end && Date.now() >= timer.end) { clearInterval(timer.h); timer.end = 0; toast("Waktu habis! Buka lagi dan cocokkan."); confetti(); } }

function vMikir(){
  const CS = casesOf(), c = CS.find(x => x.id === ui.caseId) || CS[0];
  const stage = ui.caseStage[c.id] || 0;
  return '<div class="view-head"><span class="eyebrow">Clinical reasoning</span><h2>Cara Mikir Dokter</h2><p>Dokter yang kelihatan punya "sense" sebenarnya menjalankan urutan yang sama berulang-ulang sampai otomatis. Kamu bisa melatih urutan itu. Kuncinya: jangan langsung menebak penyakit, tapi sempitkan pelan-pelan.</p></div>'+
  '<div class="card"><h3>Tangga 6 anak tangga</h3><p class="small muted" style="margin:4px 0 12px">Pakai untuk kasus apa pun, bahkan saat kamu tidak tahu ini materi KUL yang mana.</p><div class="ladder">'+
    [["1","Keluhan utama → sistem organ",(isRepro()?"Perdarahan? Nyeri perut? Sakit kepala saat hamil? Tanya dulu: usia kehamilan berapa, lalu organ/sistem apa saja yang bisa bikin keluhan ini?":"Bengkak? Nyeri pinggang? Demam? Tanya dulu: organ/sistem apa saja yang bisa bikin keluhan ini?"),"var(--s1)"],
     ["2","Lokasi anatomi",(isRepro()?"Perdarahan hamil: dari uterus (hasil konsepsi, plasenta), serviks, atau di luar uterus (tuba)? Pakai pengetahuan normal (anat-histo-fisio).":"Kalau ginjal: di glomerulus, tubulus, atau saluran kemih? Pakai pengetahuan normal (anat-histo-fisio)."),"var(--s2)"],
     ["3","Mekanisme (patofisiologi)","Kenapa bisa terjadi? Bocor, sumbat, infeksi, imun, tumor, bawaan, trauma, obat. Jembatan keledai: VINDICATE (Vaskular, Infeksi, Neoplasma, Degeneratif, Iatrogenik/Intoksikasi, Kongenital, Autoimun, Trauma, Endokrin/metabolik).","var(--s3)"],
     ["4","Diagnosis banding + clue pembeda","Tulis 2–4 kandidat, lalu cari clue yang MEMBEDAKAN mereka, bukan clue yang dimiliki semuanya.","var(--s4)"],
     ["5","Pemeriksaan untuk memutuskan","Pilih pemeriksaan yang hasilnya mengubah keputusan: ini yang sering ditanya di UAB.","var(--s5)"],
     ["6","Terapi = sebab + gejala + komplikasi",(isRepro()?"Selamatkan ibu dulu (ABC, resusitasi), lalu janin. Tentukan: lanjutkan kehamilan atau akhiri, dan lewat jalan apa (pervaginam atau SC).":"Hilangkan penyebab, redakan gejala, cegah/obati komplikasi, edukasi. Dosis anak pakai BB atau LPB."),"var(--pop)"]].map(r => '<div class="rung"><div class="k" style="background:'+r[3]+'">'+r[0]+'</div><div><b>'+r[1]+'</b><p class="small muted">'+r[2]+'</p></div></div>').join("")+
  '</div></div>'+
  '<div class="grid2">'+
    '<div class="box key"><b class="lab">Illness script</b><p>Simpan tiap penyakit dalam 4 kotak yang sama: <b>siapa</b> (usia, faktor risiko) · <b>mekanisme</b> · <b>gambaran khas</b> (gejala, lab, histo) · <b>tata laksana</b>. Rangkuman di web ini sengaja diurutkan begitu supaya otakmu terbiasa.</p></div>'+
    '<div class="box trap"><b class="lab">Kenapa sering blank</b><p>Biasanya karena hafalannya per judul KUL ('+(isRepro()?'"ini KUL perdarahan"':'"ini KUL SN"')+'), bukan per keluhan. Di ujian dan di klinik, pasien datang membawa keluhan, bukan judul. Latih dari keluhan dengan kasus misteri di bawah.</p></div>'+
  '</div>'+
  '<div class="stack"><div class="row" style="justify-content:space-between"><h3>Kasus misteri</h3><div class="subtabs">'+CS.map(x => '<button class="'+(x.id===c.id?'on':'')+'" data-act="case" data-id="'+x.id+'">'+esc(x.title.replace("Kasus misteri ",""))+'</button>').join("")+'</div></div>'+
  '<div class="card case-stage"><div class="row" style="justify-content:space-between"><b>'+esc(c.title)+'</b><span class="chip grape">Tahap '+(stage+1)+' / '+c.stages.length+'</span></div>'+
    '<div class="meter"><i style="width:'+((stage+1)/c.stages.length*100)+'%;background:var(--grape)"></i></div>'+
    c.stages.slice(0, stage+1).map((st, i) => caseStage(c, st, i, i===stage)).join("")+
    '<div class="row">'+(stage>0?'<button class="btn tiny ghost" data-act="cprev">Kembali</button>':'')+(stage < c.stages.length-1 ? '<button class="btn tiny solid" data-act="cnext">Buka info berikutnya</button>' : '<span class="chip aqua">Kasus selesai. Coba ceritakan ulang alurnya dengan suaramu sendiri (recall).</span>')+'<button class="btn tiny ghost" data-act="creset">Ulang dari awal</button></div>'+
  '</div></div>'+
  '<p class="small muted">Kasus baru dari tiap KUL akan aku tambahkan setelah PPT-nya masuk.</p>';
}
function caseStage(c, st, i, current){
  const key = c.id+":"+i; const sel = ui.caseSel[key] || {}; const shown = sel.__hint;
  return '<div class="think"><span class="eyebrow">'+(i+1)+'. '+esc(st.k)+'</span><div class="reveal">'+esc(st.reveal)+'</div>'+
    '<p><b>'+esc(st.ask)+'</b></p>'+
    '<div class="ddx">'+st.ddx.map(d => { const on = sel[d]; const isOut = st.cross && on; const right = shown && st.answer === d; return '<button class="'+(st.cross ? (isOut?'out':'') : (on?'on':''))+'" style="'+(right?'background:var(--ok);color:#fff;border-color:var(--ok)':'')+'" data-act="ddx" data-k="'+key+'" data-d="'+esc(d)+'">'+esc(d)+'</button>'; }).join("")+'</div>'+
    (shown ? '<div class="box clin"><b class="lab">Cara dokter berpikir di tahap ini</b><p>'+esc(st.hint)+'</p></div>' : (current ? '<button class="btn tiny" data-act="hint" data-k="'+key+'">Lihat cara berpikirnya</button>' : '<button class="btn tiny ghost" data-act="hint" data-k="'+key+'">Lihat cara berpikirnya</button>'))+
  '</div>';
}

  klinis:["Uretritis GO/klamidia menyerang epitel silindris (KUL 11).","Hipospadia/epispadia = muara uretra salah tempat (KUL 14).","Ejakulasi retrograd bila leher buli gagal menutup (KUL 16).","Ruptur uretra posterior pada fraktur pelvis (membranasea)."],
  tes:[["Bagian uretra laki-laki yang paling pendek dan paling mudah cedera?","Pars membranasea."],["Epitel fossa navikularis?","Berlapis gepeng."]]},
 {id:"testis", nm:"Testis & skrotum", kul:"KUL 10, 15, 16, 17",

        {f:"testis", cap:"Testis potongan sagital: tunika albuginea, septa membagi lobulus berisi tubulus seminiferus → tubulus rektus → rete testis → duktus eferen → kepala, badan, ekor epididimis → vas deferens.", lab:"Tunica albuginea · Tunica vaginalis · Seminiferous tubule = tubulus seminiferus · Rete testis · Efferent ductule = duktus eferen · Head/Body/Tail of epididymis = kaput/korpus/kauda epididimis"},

        {f:"aksis-hpg", cap:"Aksis hipotalamus–hipofisis–testis: GnRH → LH (sel Leydig → testosteron) & FSH (sel Sertoli → ABP, inhibin); testosteron & inhibin memberi umpan balik negatif.", lab:"FSH/LH release · Inhibin · Testosterone = testosteron · ABP = androgen-binding protein"}],
  anat:["Lapisan skrotum dari luar: kulit → dartos → fasia spermatika eksterna → kremaster → fasia spermatika interna → tunika vaginalis (parietal & viseral) → tunika albuginea.","A. testikularis langsung dari aorta (L2); vena kanan → v. kava, vena kiri → v. renalis kiri.","Limfe testis → KGB para-aorta; limfe skrotum → KGB inguinal (alasan orkidektomi lewat inguinal).","Refleks kremaster: n. genitofemoral L1–L2."],
  histo:["Tubulus seminiferus: epitel germinal berlapis (spermatogonia → spermatosit → spermatid → sperma) + sel Sertoli (sawar darah-testis, tight junction).","Interstisium: sel Leydig (sitoplasma eosinofilik, kristal Reinke) → testosteron.","Tunika albuginea: jaringan ikat padat, tidak elastis."],
  fisio:["Spermatogenesis ±64–74 hari; butuh suhu 2–3 °C lebih rendah (pleksus pampiniformis, dartos, kremaster).","LH → Leydig → testosteron; FSH + testosteron → Sertoli → spermatogenesis, ABP, inhibin.","Testosteron → DHT (5α-reduktase) untuk prostat & genitalia eksterna."],
  klinis:["Torsio (bell-clapper), UDT, hidrokel, varikokel (KUL 15).","Orkitis mumps → atrofi karena tunika albuginea tidak elastis (KUL 10).","Tumor sel germinal 90%; limfe ke para-aorta (KUL 17).","Andropause: sel Leydig berkurang (KUL 16)."],
  tes:[["Sel penghasil testosteron dan sel penghasil inhibin?","Sel Leydig (testosteron) dan sel Sertoli (inhibin, ABP)."],["Ke mana limfe testis mengalir?","KGB para-aorta/retroperitoneal setinggi ginjal."],["Lapisan yang berisi cairan pada hidrokel?","Di antara lapisan parietal dan viseral tunika vaginalis."]]},
 {id:"saluran", nm:"Epididimis, vas, vesikula & prostat", kul:"KUL 10, 16, 17",
  imgs:[{f:"genital-pria", cap:"(c) Sistem reproduksi pria tampak lateral: vas deferens naik lewat kanalis inguinalis, melengkung di belakang buli, ampula + vesikula seminalis = duktus ejakulatorius yang menembus prostat ke uretra prostatika.", lab:"Ductus (vas) deferens · Ampulla · Seminal vesicle = vesikula seminalis · Ejaculatory duct = duktus ejakulatorius · Prostate gland = prostat · Bulbourethral gland = kelenjar Cowper"},
        {svg:"prostat", cap:"Zona prostat menurut McNeal (skema sendiri): perifer ±70% (asal ±75% kanker, teraba saat colok dubur), transisi ±5% (asal BPH, mengelilingi uretra), sentral ±25% (mengelilingi duktus ejakulatorius), stroma fibromuskular anterior."}],
  anat:["Epididimis: kaput (menerima duktus eferen), korpus, kauda (penyimpanan sperma) di posterolateral testis.","Vas deferens ±45 cm, dinding otot tebal (teraba seperti tali keras di funikulus) → ampula.","Vesikula seminalis di belakang buli; bergabung dengan ampula = duktus ejakulatorius.","Prostat ±20 g di bawah buli, mengelilingi uretra; posterior dipisahkan dari rektum oleh fasia Denonvilliers."],
  histo:["Epididimis: epitel bertingkat silindris (pseudostratified) dengan stereosilia; lumen rata berisi sperma.","Vas deferens: lumen kecil, mukosa berlipat, otot polos sangat tebal (longitudinal dalam, sirkular tengah, longitudinal luar).","Vesikula seminalis: mukosa sangat berlipat seperti sarang lebah, epitel bertingkat/selapis silindris.","Prostat: kelenjar tubuloalveolar dengan stroma fibromuskular; korpora amilasea (konkresi) di lumen, makin banyak dengan usia."],
  fisio:["Epididimis: pematangan sperma ±2 minggu (motilitas & kemampuan membuahi).","Komposisi semen: vesikula ±60–70% (fruktosa, semenogelin), prostat ±25–30% (PSA, zinc, sitrat), sisanya sperma & Cowper.","Urutan ejakulasi: cairan prostat → sperma → cairan vesikula seminalis.","Emisi oleh simpatis T10–L2; propulsi oleh n. pudendus."],
  klinis:["Epididimitis: pria muda = IMS, tua = E. coli (KUL 10).","Prostatitis & uji 4 tabung Meares-Stamey (KUL 10).","BPH zona transisi, kanker zona perifer (KUL 17).","Ejakulasi retrograd pasca-TURP (KUL 16)."],
  tes:[["Epitel epididimis dan ciri khas permukaannya?","Bertingkat silindris dengan stereosilia."],["Zona prostat asal BPH dan asal kanker?","Transisi (BPH), perifer (kanker)."],["Kelenjar penyumbang volume semen terbesar?","Vesikula seminalis (fruktosa)."]]},
 {id:"penis", nm:"Penis", kul:"KUL 14, 16, 17",
  imgs:[{f:"penis", cap:"Penis flasid vs ereksi: dua korpus kavernosum (dorsal) dan satu korpus spongiosum (ventral, berisi uretra). Saat ereksi a. kavernosa melebar, sinusoid terisi, vena subtunika tertekan ke tunika albuginea (veno-oklusi).", lab:"Corpora cavernosa = korpus kavernosum · Corpus spongiosum = korpus spongiosum · Spongy urethra = uretra spongiosa · Deep dorsal vein = v. dorsalis profunda · Cavernosal arteries = a. kavernosa · Prepuce = preputium"},
        {f:"genital-pria", cap:"(a–b) Penis tidak disirkumsisi vs disirkumsisi: preputium menutupi glans; korona dan glans tampak setelah sirkumsisi.", lab:"Prepuce (foreskin) = preputium · Glans penis · Corona = korona"}],
  anat:["Tiga silinder: 2 korpus kavernosum (dorsal) + korpus spongiosum (ventral, ujungnya glans).","Pembungkus: tunika albuginea → fasia Buck → fasia dartos → kulit.","Neurovaskular dorsal di jam 12, uretra di jam 6 → aspirasi priapismus di jam 3/9.","Darah: a. pudenda interna → a. kavernosa (sentral), a. dorsalis, a. bulbouretralis; limfe kulit/glans → KGB inguinal."],
  histo:["Jaringan erektil: ruang sinusoid berlapis endotel dipisahkan trabekula otot polos.","Tunika albuginea: kolagen padat dua lapis, sangat kuat; lebih tipis di sekitar spongiosum.","Uretra spongiosa: epitel bertingkat silindris; fossa navikularis berlapis gepeng."],
  fisio:["Ereksi: parasimpatis S2–S4/NANC → NO → cGMP → relaksasi otot polos → sinusoid terisi → veno-oklusi.","Detumesen: simpatis + PDE5 memecah cGMP.","Fase: flasid → pengisian → tumesen → ereksi penuh → rigid (iskiokavernosus) → detumesen."],
  klinis:["Hipospadia, fimosis/parafimosis, priapismus, Peyronie (KUL 14).","Disfungsi ereksi & PDE5i (KUL 16).","Karsinoma penis, faktor risiko fimosis (KUL 17).","Gangren Fournier menjalar di fasia dartos–Colles–Scarpa (KUL 10)."],
  tes:[["Mengapa aspirasi priapismus di jam 3 atau 9?","Hindari neurovaskular dorsal (jam 12) dan uretra/spongiosum (jam 6)."],["Mekanisme veno-oklusi?","Sinusoid yang terisi menekan vena subtunika ke tunika albuginea yang tidak elastis."]]}

 {id:"panggul", nm:"Panggul & jalan lahir", kul:"KUL 7, 8, 10",
  imgs:[
   {f:"repro/panggul-tulang", cap:"Panggul tampak depan: dua os coxae (ilium, iskium, pubis) bertemu di simfisis pubis di depan dan sakrum di belakang. Garis pelvic brim (linea terminalis) adalah batas pintu atas panggul.", lab:"Hip bone = os coxae · Sacral promontory = promontorium · Pelvic brim = linea terminalis · Pubic symphysis = simfisis pubis · Ischial tuberosity = tuber iskiadikum · Coccyx = koksigis"},
   {f:"repro/panggul-wanita-pria", cap:"Panggul wanita vs pria: pada wanita pintu atas lebih bulat dan lebar, sudut subpubis (arkus pubis) lebih dari 90°, dan rongga panggul lebih dangkal. Bentuk inilah yang memberi ruang untuk kepala janin.", lab:"Female = wanita · Male = pria · Pelvic brim = pintu atas panggul · Subpubic angle = sudut subpubis"}],
  anat:["Panggul = 2 os coxae (ilium, iskium, pubis) + sakrum + koksigis, disatukan sendi sakroiliaka dan simfisis pubis.","Pintu atas panggul (PAP): promontorium – linea terminalis – tepi atas simfisis. Konjugata vera ±11 cm, konjugata diagonalis ±12,5 cm (vera ≈ diagonalis − 1,5 cm), diameter transversa ±13 cm.","Bidang tengah panggul setinggi spina iskiadika: diameter interspinarum ±10 cm, diameter terkecil jalan lahir.","Pintu bawah panggul: diameter anteroposterior ±11,5 cm, diameter intertuberosum ±11 cm, arkus pubis normal >90°.","Bidang Hodge: H I = PAP; H II sejajar H I setinggi tepi bawah simfisis; H III setinggi spina iskiadika (= stasion 0); H IV setinggi ujung koksigis.","Tipe Caldwell–Moloy: ginekoid (PAP bulat, paling sering), android (bentuk hati, menyempit ke bawah), antropoid (lonjong ke depan-belakang), platipeloid (pipih, lebar ke samping)."],
  histo:["Tulang panggul: tulang kompakta di luar, spongiosa di dalam berisi sumsum merah.","Simfisis pubis: sendi fibrokartilago. Relaksin dan progesteron melonggarkan simfisis dan sendi sakroiliaka saat hamil.","Dasar panggul: m. levator ani (puborektalis, pubokoksigeus, iliokoksigeus) adalah otot rangka; perineal body adalah simpul jaringan fibromuskular di antara vagina dan anus."],
  fisio:["Saat hamil ligamen panggul melonggar sehingga panggul sedikit lebih lentur, tapi muncul nyeri simfisis dan cara jalan 'bebek'.","Pintu atas panggul paling lebar ke samping, pintu bawah paling lebar ke depan-belakang. Karena itu kepala janin harus berputar (putar paksi dalam) saat turun.","Posisi McRoberts (paha ditekuk ke perut) memutar simfisis ke atas dan meluruskan sakrum sehingga ruang pintu bawah bertambah."],
  klinis:["Panggul sempit atau kepala besar → disproporsi kepala panggul (CPD) → partus macet, bahaya ruptur uteri (KUL 10).","Stasion dan bidang Hodge dipakai di partograf dan sebagai syarat ekstraksi vakum (KUL 7, 8).","Manuver McRoberts pada distosia bahu (KUL 10).","Robekan perineum derajat 1–4 dan episiotomi (KUL 8)."],
  tes:[["Diameter terkecil jalan lahir dan letaknya?","Diameter interspinarum ±10 cm di bidang tengah panggul, setinggi spina iskiadika (Hodge III)."],["Konjugata diagonalis 11 cm. Berapa konjugata vera dan artinya?","±9,5 cm (diagonalis − 1,5 cm), berarti PAP sempit (<10 cm)."],["Tipe panggul dengan prognosis persalinan pervaginam terbaik?","Ginekoid."]]},
 {id:"uterus", nm:"Uterus, serviks, tuba & ovarium", kul:"KUL 2, 3, 7, 8, 9, 10",
  imgs:[
   {f:"repro/genital-wanita", cap:"(a) Potongan sagital: uterus antefleksi di antara kandung kemih (depan) dan rektum (belakang); serviks menonjol ke vagina. (b) Tampak depan: tuba, ovarium, dan ligamen penggantung.", lab:"Uterus = rahim · Uterine tube (oviduct) = tuba fallopi · Cervix = serviks · Vagina = vagina · Ovary = ovarium · Broad ligament = lig. latum · Ovarian ligament = lig. ovarii proprium · Fimbriae = fimbria"},
   {f:"repro/uterus-tuba-ovarium", cap:"Uterus dan adneksa: tuba terbagi menjadi bagian interstisial, istmus, ampula, dan infundibulum berfimbria. Gambar kecil menunjukkan mikroskop dinding uterus: endometrium, miometrium, perimetrium.", lab:"Fundus = fundus · Body = korpus · Isthmus = istmus · Ampulla = ampula · Infundibulum = infundibulum · Endometrium/Myometrium/Perimetrium = endometrium/miometrium/perimetrium · Uterine artery = a. uterina"},

   {f:"repro/siklus-ovarium-uterus", cap:"Siklus ovarium dan siklus endometrium berjalan bersama: fase folikular (FSH, estrogen) → lonjakan LH dan ovulasi hari ±14 → fase luteal (progesteron) → menstruasi bila tidak hamil.", lab:"Follicular phase = fase folikular · Ovulation = ovulasi · Luteal phase = fase luteal · Menses = menstruasi · Proliferative/Secretory phase = fase proliferasi/sekresi"}],
  anat:["Uterus: fundus, korpus, istmus (menjadi segmen bawah rahim saat hamil), dan serviks dengan ostium internum dan eksternum.","Posisi tersering antefleksi-antefersi; ditopang lig. kardinale (Mackenrodt), uterosakral, rotundum, dan latum.","A. uterina (cabang a. iliaka interna) menyilang di atas ureter setinggi serviks, lalu beranastomosis dengan a. ovarika.","Tuba: interstisial – istmus – ampula (tempat fertilisasi dan kehamilan ektopik tersering) – infundibulum dengan fimbria.","Ovarium di fossa ovarika, digantung lig. suspensorium (berisi a/v ovarika) dan lig. ovarii proprium."],
  histo:["Endometrium: epitel kolumnar selapis, kelenjar, dan stroma; lapisan fungsionalis luruh saat haid, lapisan basalis untuk regenerasi.","Saat hamil endometrium berubah menjadi desidua (sel stroma membesar berisi glikogen); desidua basalis menjadi bagian ibu dari plasenta.","Miometrium: otot polos tebal; serat lapisan tengah beranyaman seperti angka 8 sehingga menjepit pembuluh darah saat berkontraksi ('living ligature').","Serviks: endoserviks kolumnar penghasil lendir, ektoserviks epitel gepeng berlapis tidak berkeratin; batasnya zona transformasi.","Tuba: epitel kolumnar bersilia dan sel sekretorik (peg cell). Silia dan peristaltik mendorong ovum ke uterus."],
  fisio:["Siklus endometrium: proliferasi (estrogen) → sekresi (progesteron) → menstruasi bila korpus luteum mati.","Saat hamil uterus membesar dari ±70 g menjadi ±1.100 g, terutama karena hipertrofi sel otot.","Serviks hamil melunak (tanda Goodell) dan kebiruan (tanda Chadwick); sumbat lendir menutup kanalis servikalis.","Kontraksi Braxton Hicks: tidak teratur, tidak nyeri, tidak membuka serviks."],
  klinis:["Kehamilan ektopik paling sering di ampula tuba (KUL 2).","Segmen bawah rahim yang tipis: lokasi insisi seksio sesarea transversal, juga lokasi ruptur uteri dan cincin Bandl (KUL 8, 10).","Atonia uteri = miometrium gagal berkontraksi → perdarahan pascapersalinan (KUL 3, 7).","Serviks inkompeten → keguguran atau persalinan preterm trimester 2 tanpa nyeri, ditangani serklase (KUL 9).","Plasenta akreta: desidua basalis tidak terbentuk baik (misalnya bekas SC) sehingga vili melekat ke miometrium (KUL 3)."],
  tes:[["Hubungan a. uterina dengan ureter?","A. uterina menyilang di atas ureter ±2 cm lateral serviks, sehingga ureter berisiko terpotong saat histerektomi."],["Lapisan endometrium yang luruh saat haid?","Stratum fungsionalis; stratum basalis tetap untuk regenerasi."],["Kenapa kontraksi miometrium menghentikan perdarahan setelah plasenta lahir?","Serat otot beranyaman menjepit pembuluh darah ('living ligature')."]]},
 {id:"konsepsi", nm:"Fertilisasi & implantasi", kul:"KUL 2, 4",
  imgs:[
   {f:"repro/fertilisasi", cap:"Fertilisasi: ratusan sperma menembus korona radiata, enzim akrosom melubangi zona pelusida, lalu satu sperma menyatu dengan membran oosit.", lab:"Corona radiata = korona radiata · Zona pellucida = zona pelusida · Acrosome = akrosom · Oocyte = oosit"},

   {f:"repro/trofoblas", cap:"Embrio minggu ke-2: trofoblas terbagi menjadi sitotrofoblas (dalam) dan sinsitiotrofoblas (luar, invasif, penghasil hCG). Diskus embrio dua lapis: epiblas dan hipoblas.", lab:"Cytotrophoblast = sitotrofoblas · Syncytiotrophoblast = sinsitiotrofoblas · Epiblast/Hypoblast = epiblas/hipoblas · Amniotic cavity = rongga amnion"}],
  anat:["Ovulasi melepas oosit sekunder (berhenti di metafase II) yang dibungkus zona pelusida dan korona radiata, lalu ditangkap fimbria.","Fertilisasi di ampula tuba, biasanya dalam 24 jam setelah ovulasi; sperma bisa bertahan ±3–5 hari.","Zigot membelah sambil berjalan ke uterus: morula ±hari 3–4, blastokista ±hari 5.","Implantasi ±hari 6–7 setelah fertilisasi, biasanya di dinding posterior-superior korpus uteri."],
  histo:["Blastokista: massa sel dalam/embrioblas (menjadi janin), trofoblas (menjadi plasenta), dan rongga blastokel.","Sitotrofoblas membelah aktif; sinsitiotrofoblas berinti banyak, menembus endometrium, dan membuat hCG.","Minggu ke-3 terjadi gastrulasi: tiga lapis germinal (ektoderm, mesoderm, endoderm)."],
  fisio:["Reaksi akrosom membuat sperma bisa menembus zona pelusida; reaksi korteks oosit mencegah lebih dari satu sperma masuk (polispermia).","Setelah sperma masuk, oosit menyelesaikan meiosis II; dua pronukleus bergabung menjadi zigot 46 kromosom.","hCG terdeteksi di serum ±8–11 hari setelah konsepsi; tugasnya mempertahankan korpus luteum agar progesteron tetap tinggi.","Di awal kehamilan normal, kadar hCG naik kira-kira 2 kali tiap 48 jam."],
  klinis:["Implantasi di luar kavum uteri = kehamilan ektopik; ampula tersering (KUL 2).","Mola komplet: ovum tanpa inti dibuahi lalu kromosom ayah menggandakan diri (46,XX) → tanpa janin. Mola parsial: triploid 69 kromosom (KUL 2).","hCG yang naik terlalu lambat → curiga kehamilan ektopik atau abortus; terlalu tinggi → curiga mola atau gemeli (KUL 2).","Kembar monozigot: hari terjadinya pembelahan menentukan jumlah korion dan amnion (KUL 4)."],
  tes:[["Di mana fertilisasi normal terjadi?","Ampula tuba fallopi."],["Sel penghasil hCG?","Sinsitiotrofoblas."],["Kariotipe mola komplet vs parsial?","Komplet 46,XX (semua dari ayah); parsial triploid 69,XXY atau 69,XXX."]]},

  anat:["Plasenta aterm: cakram diameter ±15–20 cm, tebal ±2–3 cm, berat ±500 g.","Sisi ibu: 15–20 kotiledon, merah dan kasar. Sisi janin: licin, dilapisi amnion, tempat tali pusat menempel.","Tali pusat: 2 arteri (membawa darah miskin O2 dari janin) dan 1 vena (membawa darah kaya O2 ke janin) dalam jeli Wharton; panjang ±50–60 cm.","Selaput ketuban: amnion (dalam, tanpa pembuluh darah) dan korion (luar)."],
  histo:["Vili korialis: inti mesenkim dengan kapiler janin, dilapisi sitotrofoblas (makin jarang di trimester 3) dan sinsitiotrofoblas.","Ruang intervili diisi darah ibu dari arteri spiralis. Tipe plasenta manusia: hemokorial.","Sawar plasenta makin tipis seiring usia kehamilan sehingga pertukaran zat makin mudah.","Pada preeklamsia: infark plasenta, aterosis akut arteri spiralis, dan sinsitial knot bertambah."],
  fisio:["O2 dan CO2 lewat difusi sederhana; glukosa lewat difusi terfasilitasi (GLUT1); IgG lewat transpor aktif melalui reseptor FcRn; IgM tidak bisa lewat.","Plasenta adalah kelenjar endokrin: hCG, hPL (antiinsulin), progesteron, estrogen, dan CRH.","Arteri spiralis diremodel trofoblas sehingga lebar, bertahanan rendah, dan tidak bisa menyempit.","Cairan amnion: setelah ±16 minggu sumber utamanya urin janin, dibuang lewat ditelan janin; volume terbanyak ±1 L sekitar 34–36 minggu."],
  klinis:["Plasenta previa: menutupi atau dekat ostium → perdarahan tanpa nyeri (KUL 3).","Solusio plasenta: plasenta lepas sebelum bayi lahir → nyeri dan uterus tegang (KUL 3).","Vasa previa: pembuluh janin di selaput melintasi ostium → darah janin keluar saat ketuban pecah (KUL 3).","Gagal remodeling arteri spiralis → preeklamsia dan FGR (KUL 4, 5).","IgG anti-D ibu melewati plasenta → hemolisis janin (KUL 4).","Oligohidramnion: agenesis ginjal atau obstruksi saluran kemih janin; polihidramnion: atresia esofagus, anensefali, diabetes (KUL 4)."],

function vFisioRepro(){
  return '<div class="grid2">'+
    fcard("Hormon kehamilan", '<div class="flow"><span class="node">Sinsitiotrofoblas → hCG (puncak ±8–10 mgg)</span><span class="arr">→</span><span class="node">Korpus luteum bertahan</span><span class="arr">→</span><span class="node">Progesteron tinggi</span><span class="arr">→</span><span class="node">±7–10 mgg plasenta ambil alih</span></div><ul class="small" style="margin:8px 0 0;padding-left:1.1em"><li>Progesteron: menenangkan miometrium, menutup serviks.</li><li>Estrogen: menumbuhkan uterus dan payudara, menambah reseptor oksitosin menjelang aterm.</li><li>hPL: melawan insulin supaya glukosa tersedia untuk janin (dasar diabetes gestasional).</li></ul>')+
    fcard("Jantung & darah ibu", '<ul class="small" style="margin:0;padding-left:1.1em"><li>Volume plasma naik ±40–50%, eritrosit ±20–30% → Hb turun (hemodilusi).</li><li>Curah jantung naik ±30–50%; tahanan perifer turun; tekanan darah paling rendah di trimester 2.</li><li>Telentang di trimester 3 → kompresi aortokaval → hipotensi. Miringkan ke kiri.</li><li>Fibrinogen dan faktor VII, VIII, X naik → hiperkoagulasi (melindungi dari perdarahan saat lahir, tapi risiko trombosis).</li></ul>')+
    fcard("Ginjal, napas & metabolisme", '<ul class="small" style="margin:0;padding-left:1.1em"><li>GFR naik ±50% → kreatinin dan ureum turun; glukosuria ringan bisa normal.</li><li>Progesteron merangsang pusat napas → ventilasi naik → PaCO2 ±30 mmHg (alkalosis respiratorik terkompensasi).</li><li>Paruh kedua kehamilan: resistensi insulin naik → skrining diabetes gestasional 24–28 minggu.</li></ul>')+
    fcard("Sirkulasi uteroplasenta", '<div class="flow"><span class="node">A. uterina</span><span class="arr">→</span><span class="node">A. arkuata → radialis</span><span class="arr">→</span><span class="node">A. spiralis (diremodel trofoblas)</span><span class="arr">→</span><span class="node">Ruang intervili</span></div><p class="small" style="margin:8px 0 0">Aliran darah uterus aterm ±500–750 mL/menit. Arteri spiralis yang sudah diremodel lebar dan tidak bisa menyempit, jadi aliran ke plasenta tergantung tekanan darah ibu. Remodeling gagal → plasenta iskemia → preeklamsia dan FGR.</p>')+
    fcard("Kenapa persalinan dimulai", '<ul class="small" style="margin:0;padding-left:1.1em"><li>Efek progesteron menurun secara fungsional (reseptornya berubah).</li><li>CRH plasenta dan kortisol janin naik → estrogen naik.</li><li>Estrogen menambah reseptor oksitosin dan gap junction → miometrium berkontraksi serentak.</li><li>Prostaglandin mematangkan serviks dan memicu his.</li><li>Refleks Ferguson: kepala menekan serviks → oksitosin → his makin kuat.</li></ul>')+
    fcard("Kala persalinan", '<div class="flow"><span class="node">Kala I: laten → aktif (±5 cm, WHO 2018)</span><span class="arr">→</span><span class="node">Kala II: lengkap → bayi lahir</span><span class="arr">→</span><span class="node">Kala III: bayi → plasenta lahir</span><span class="arr">→</span><span class="node">Kala IV: 2 jam pemantauan</span></div><p class="small" style="margin:8px 0 0">His efektif: teratur, makin sering, makin lama, makin kuat. Segmen atas menebal (retraksi), segmen bawah menipis.</p>')+
    fcard("Mekanisme persalinan (7 gerakan)", '<div class="flow"><span class="node">Engagement</span><span class="arr">→</span><span class="node">Penurunan</span><span class="arr">→</span><span class="node">Fleksi</span><span class="arr">→</span><span class="node">Putar paksi dalam</span><span class="arr">→</span><span class="node">Ekstensi</span><span class="arr">→</span><span class="node">Putar paksi luar</span><span class="arr">→</span><span class="node">Ekspulsi</span></div><p class="small" style="margin:8px 0 0">Fleksi membuat kepala masuk dengan diameter terkecil (suboksipitobregmatika ±9,5 cm). Putar paksi dalam terjadi karena pintu atas panggul lebar ke samping, sedangkan pintu bawah lebar ke depan-belakang.</p>')+
    fcard("Adaptasi bayi baru lahir", '<ul class="small" style="margin:0;padding-left:1.1em"><li>Napas pertama → paru mengembang → tahanan paru turun.</li><li>Tali pusat dijepit → tahanan sistemik naik → tekanan atrium kiri > kanan → foramen ovale menutup.</li><li>O2 naik dan prostaglandin turun → duktus arteriosus menutup dalam 1–3 hari.</li><li>Surfaktan dari pneumosit tipe II menjaga alveoli tetap terbuka; kurang surfaktan pada prematur → sindrom gawat napas.</li></ul>')+
  '</div>';
}

  '<text x="160" y="58" text-anchor="middle">stroma fibromuskular anterior</text>'+

function atlasFig(im, i){
  const body = im.svg ? prostatSVG() : '<a href="img/atlas/'+im.f+'.jpg" target="_blank" rel="noopener"><img class="qimg" loading="lazy" src="img/atlas/'+im.f+'.jpg" alt="'+esc(im.cap)+'"></a>';
  return '<figure class="card stack atlas-fig" style="margin:0">'+body+'<figcaption class="small"><b>Gambar '+(i+1)+'.</b> '+esc(im.cap)+'</figcaption>'+
    (im.lab?'<details class="small"><summary style="cursor:pointer">Arti label (gambar berbahasa Inggris)</summary><p class="muted" style="margin:6px 0 0">'+esc(im.lab)+'</p></details>':'')+
    '<span class="small muted">'+(im.svg?'Skema sendiri':'Sumber: '+(im.cr||OSX)+'. Klik gambar untuk ukuran penuh.')+'</span></figure>';
}
function vAtlas(){
  const OR = organsOf(), o = OR.find(x => x.id === ui.organ) || OR[0];
  const list = (h, arr) => '<div class="card stack"><h3>'+h+'</h3><ul class="small" style="margin:0;padding-left:1.1em;display:grid;gap:4px">'+arr.map(x => '<li>'+esc(x)+'</li>').join("")+'</ul></div>';
  return '<div class="subtabs">'+OR.map(x => '<button class="'+(x.id===o.id?'on':'')+'" data-act="organ" data-id="'+x.id+'">'+esc(x.nm)+'</button>').join("")+'</div>'+
    '<div class="row" style="justify-content:space-between"><h3 style="margin:0">'+esc(o.nm)+'</h3><span class="chip peri">Dipakai di '+esc(o.kul)+'</span></div>'+
    '<div class="grid2">'+o.imgs.map(atlasFig).join("")+'</div>'+
    '<div class="grid2">'+list("Anatomi", o.anat)+list("Histologi", o.histo)+list("Fisiologi", o.fisio)+list("Hubungan ke penyakit", o.klinis)+'</div>'+
    '<div class="card stack"><h3>Tes diri</h3>'+o.tes.map(t => '<details class="small"><summary style="cursor:pointer;font-weight:600">'+esc(t[0])+'</summary><p style="margin:6px 0 0">'+esc(t[1])+'</p></details>').join("")+'</div>'+
    '<p class="small muted">Gambar: '+OSX+', openstax.org/details/books/anatomy-and-physiology-2e'+(isRepro()?', dan Wikimedia Commons (lisensi bebas, kredit di bawah tiap gambar). Gambar Williams/Netter berhak cipta, jadi tidak dipasang di sini; pakai bukumu sendiri untuk perbandingan.':'. Gambar Netter/Yokochi/Campbell berhak cipta, jadi tidak dipasang di sini; pakai bukumu sendiri untuk perbandingan.')+'</p>';
}

function vDasar(){
  if (isRepro()) {
    const tabsR = [["atlas","Atlas organ & proses (bergambar)"],["fisio","Fisiologi kunci kehamilan & persalinan"]];
    const tR = ui.dasarTab === "fisio" ? "fisio" : "atlas";
    return '<div class="view-head"><span class="eyebrow">Normal dulu, baru sakit</span><h2>Anat · Histo · Fisio</h2><p>Dasar Blok Reproduksi untuk KUL 1–10: panggul dan jalan lahir, uterus dan adneksa, fertilisasi dan implantasi, plasenta, janin, tubuh ibu saat hamil, dan persalinan. Tiap topik ada gambar asli, anatomi, histologi, fisiologi, hubungannya ke penyakit di KUL, dan tes diri.</p></div>'+
      '<div class="subtabs">'+tabsR.map(x => '<button class="'+(x[0]===tR?'on':'')+'" data-act="dtab" data-id="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>'+(tR === "fisio" ? vFisioRepro() : vAtlas());

/* Baca PDF langsung di web (PDF.js), tanpa harus diunduh. */
const PV = { lib:null, doc:null, task:null, obs:null, scale:1 };
function pvLoadLib(){
  if (PV.lib) return Promise.resolve(PV.lib);
  return new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = () => { const L = window.pdfjsLib; if (!L) return rej(new Error("pdfjs")); L.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; PV.lib = L; res(L); };
    sc.onerror = () => rej(new Error("pdfjs"));
    document.head.appendChild(sc);
  });
}
function pvEl(){
  let el = document.getElementById("pdfv");
  if (el) return el;
  el = document.createElement("div"); el.id = "pdfv";
  el.innerHTML = '<div class="pv-bar"><button class="btn tiny" data-pv="close">✕ Tutup</button><b class="pv-t"></b><span class="small muted pv-n"></span><button class="btn tiny" data-pv="out">−</button><button class="btn tiny" data-pv="in">+</button></div><div class="pv-pages"></div>';
  document.body.appendChild(el);
  el.addEventListener("click", e => { const b = e.target.closest("[data-pv]"); if (!b) return; const a = b.dataset.pv;
    if (a === "close") pvClose(); else { PV.scale = Math.min(2.5, Math.max(0.6, PV.scale + (a === "in" ? 0.25 : -0.25))); pvLayout(); } });
  el.querySelector(".pv-pages").addEventListener("scroll", pvCount, {passive:true});
  return el;
}
function pvClose(){
  const el = document.getElementById("pdfv"); if (el) { el.classList.remove("on"); el.querySelector(".pv-pages").innerHTML = ""; }
  if (PV.obs) PV.obs.disconnect(); if (PV.task) try { PV.task.destroy(); } catch(_) {}
  PV.doc = PV.task = PV.obs = null; document.body.style.overflow = "";
}
function pvCount(){
  const el = document.getElementById("pdfv"); if (!el || !PV.doc) return;
  const box = el.querySelector(".pv-pages"), mid = box.scrollTop + box.clientHeight / 3;
  let n = 1; box.querySelectorAll(".pv-pg").forEach((p, i) => { if (p.offsetTop <= mid) n = i + 1; });
  el.querySelector(".pv-n").textContent = n + " / " + PV.doc.numPages;
}
async function pvRender(div){
  if (div.dataset.done || !PV.doc) return; div.dataset.done = "1";
  try {
    const pg = await PV.doc.getPage(+div.dataset.p), w = div.clientWidth || 600;
    const vp1 = pg.getViewport({scale:1}), dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = pg.getViewport({scale: (w / vp1.width) * dpr});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await pg.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    div.innerHTML = ""; div.appendChild(c); div.style.minHeight = "";
  } catch (e) { div.dataset.done = ""; }
}
function pvLayout(){
  const el = pvEl(), box = el.querySelector(".pv-pages"); if (!PV.doc) return;
  const keep = box.scrollTop / (box.scrollHeight || 1);
  if (PV.obs) PV.obs.disconnect();
  const avail = Math.min(box.clientWidth - 16, 900) * PV.scale;
  PV.ratio = PV.ratio || 1.414;
  box.innerHTML = "";
  for (let i = 1; i <= PV.doc.numPages; i++) {
    const d = document.createElement("div"); d.className = "pv-pg"; d.dataset.p = i;
    d.style.width = avail + "px"; d.style.maxWidth = PV.scale > 1 ? "none" : "100%"; d.style.minHeight = (avail * PV.ratio) + "px";
    box.appendChild(d);
  }
  PV.obs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) pvRender(x.target); }), {root: box, rootMargin: "800px 0px"});
  box.querySelectorAll(".pv-pg").forEach(d => PV.obs.observe(d));
  box.scrollTop = keep * box.scrollHeight; pvCount();
}
async function openPdf(name, title){
  const el = pvEl(), box = el.querySelector(".pv-pages");
  pvClose(); el.classList.add("on"); document.body.style.overflow = "hidden";
  el.querySelector(".pv-t").textContent = title || name; el.querySelector(".pv-n").textContent = "";
  box.innerHTML = '<div class="pv-msg">Membuka PDF…</div>'; PV.scale = 1;
  try {
    const L = await pvLoadLib();
    PV.task = L.getDocument({url: "files/" + name});
    PV.doc = await PV.task.promise;
    const p1 = await PV.doc.getPage(1), v = p1.getViewport({scale:1}); PV.ratio = v.height / v.width;
    pvLayout();
  } catch (e) {
    box.innerHTML = '<div class="pv-msg">PDF belum bisa dibuka di sini. <a class="btn tiny solid" href="files/' + name + '" target="_blank" rel="noopener">Buka di tab baru</a></div>';
  }
}

function termify(html, g){
  const span = (k, t) => '<span class="term" tabindex="0" data-g="'+esc(g[k])+'" data-t="'+esc(k)+'">'+t+'</span>';
  const done = new Set();
  let out = html.replace(/\[\[([^\]]+)\]\]/g, (m, t) => { const k = Object.keys(g).find(x => x.toLowerCase() === t.toLowerCase()); if (k) done.add(k); return k ? span(k, t) : t; });
  /* istilah glosarium tanpa [[ ]]: tandai kemunculan pertama di teks (bukan di dalam tag) */
  Object.keys(g).sort((a,b) => b.length - a.length).forEach(k => {
    if (done.has(k)) return;
    const re = new RegExp('(^|[^\\p{L}\\p{N}])('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\p{L}\\p{N}])', 'iu');
    const parts = out.split(/(<[^>]+>)/); let inTerm = 0;
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      if (p.startsWith('<')){ if (/^<span class="term"/.test(p)) inTerm++; else if (inTerm && p === '</span>') inTerm--; continue; }
      if (inTerm || !re.test(p)) continue;
      parts[i] = p.replace(re, (m, a, t) => a + span(k, t)); done.add(k); break;
    }
    out = parts.join("");
  });
  return out;
}

function readiness(){
  const L = lecs(); if (!L.length) return {score:0, steps:0, quiz:0, conf:0};
  const steps = L.reduce((a,l) => a + STEPS.filter(s => stepOf(l.id,s.n).done).length, 0) / (L.length*5);
  const qsc = []; blockQuizzes().forEach(q => { const h = (S.quiz[q.id]||{}).hist||[]; if (h.length) qsc.push(h[h.length-1].score/(q.qs||[]).length); });
  const quiz = qsc.length ? qsc.reduce((a,b)=>a+b,0)/qsc.length : 0;
  const cs = L.map(l => S.conf[l.id]||0).filter(Boolean); const conf = cs.length ? cs.reduce((a,b)=>a+b,0)/cs.length/5 : 0;
  return {score:Math.round((steps*0.55 + quiz*0.3 + conf*0.15)*100), steps, quiz, conf};
}

/* dengarkan (text-to-speech bawaan browser) */
function speak(el){
  try {
    const ss = window.speechSynthesis; if (!ss) { toast("Browser ini belum mendukung suara"); return; }
    if (ss.speaking) { ss.cancel(); document.querySelectorAll(".speak.on").forEach(b => { b.classList.remove("on"); b.textContent = "▶ Dengarkan"; }); if (el.classList.contains("on")) return; }
    const u = new SpeechSynthesisUtterance(el.dataset.text); u.lang = "id-ID"; u.rate = 0.98;
    const v = ss.getVoices().find(v => /id(-|_)ID/i.test(v.lang)); if (v) u.voice = v;
    u.onend = () => { el.classList.remove("on"); el.textContent = "▶ Dengarkan"; };
    el.classList.add("on"); el.textContent = "■ Berhenti"; ss.speak(u);
  } catch(err){ toast("Suara tidak tersedia di sini"); }
}

    try { if (window.Notification && Notification.permission === "granted") new Notification("Waktunya belajar, Nadia", {body:n+" milestone menunggu"}); } catch(e){}

/* confetti kecil */
function confetti(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#fx"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#FF4F8B","#5B6CFF","#FFC83D","#11B3A3","#9B5CF6"]; const P = Array.from({length:90}, () => ({x:innerWidth/2, y:innerHeight*0.35, vx:(Math.random()-.5)*12, vy:Math.random()*-11-3, s:Math.random()*6+4, c:cols[Math.floor(Math.random()*5)], r:Math.random()*6}));
  let f = 0; (function tick(){ x.clearRect(0,0,c.width,c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.r += .2; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }); if (++f < 90) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height); })();
}

   ["C","Why should spacing help? One explanation is that when we return to material after a delay, we have partly forgotten it, and the effort of retrieving it strengthens the memory. Psychologists Robert and Elizabeth Bjork call such obstacles 'desirable difficulties'. Learning that feels easy, such as rereading notes several times in a row, creates a sense of familiarity that students often mistake for genuine understanding."],

   ["E","Technology has made spacing easier to apply. Flashcard programs based on spaced repetition algorithms schedule each item for review just before the learner is likely to forget it. Language learners in particular have adopted these tools, although critics point out that memorising isolated words is not the same as being able to use them in conversation."],
   ["F","Researchers are now investigating whether the spacing effect applies to complex skills as well as facts. Early findings from studies of surgical training suggest that it does: trainee surgeons who practised a procedure in weekly sessions outperformed those who completed the same practice in one day. If these results are confirmed, they could change how professional training is organised."]
  ],

 R2:{title:"Why Cities Need Green Spaces", time:20,
  paras:[
   ["A","For most of the twentieth century, parks were regarded by city planners as a pleasant extra: something to be added once housing, roads and offices had been built. That view is changing rapidly. As more than half of the world's population now lives in urban areas, green spaces are increasingly treated as essential infrastructure, as important to a city's functioning as its water supply or its transport network."],
   ["B","Some of the strongest evidence concerns physical health. Long-term studies in several European countries have found that people who live within walking distance of a park are more physically active and have lower rates of obesity and heart disease. Crucially, the benefit appears to be greatest among low-income groups, suggesting that access to green space could help to reduce health inequalities."],
   ["C","The effects on mental health are equally striking. In one well-known Danish study, researchers used satellite images to measure how much greenery almost one million people had grown up near. Those who spent their childhood with the least access to green space had a significantly higher risk of developing a psychiatric disorder later in life, even after differences in income and family history were taken into account."],
   ["D","Green spaces also protect cities from extreme weather. Concrete and asphalt absorb heat during the day and release it at night, making urban areas several degrees warmer than the surrounding countryside. Trees reduce this 'heat island' effect by providing shade and releasing water vapour. Parks and green roofs also absorb rainwater, lowering the risk of flash floods, which have become more frequent as rainfall patterns change."],
   ["E","Yet creating new parks in crowded cities is far from simple. Land in city centres is extremely expensive, and there is constant pressure to use it for housing. Moreover, when a run-down neighbourhood receives an attractive new park, property prices often rise, and the very residents the park was meant to benefit may be forced to move away, a process sometimes called 'green gentrification'."],
   ["F","Some cities have found creative solutions. Hamburg, for example, has developed a 'Green Network' plan to link existing parks, cemeteries and sports fields through continuous green corridors, allowing people to walk or cycle across the city without using a road. Elsewhere, unused railway lines and car parks have been turned into public gardens, showing that green space can be added without demolishing existing buildings."]
  ],
  headingList:["i The economic cost of building parks","ii A change in how planners view parks","iii Benefits for the body, especially for poorer residents","iv Linking and reusing spaces in new ways","v Long-term psychological effects","vi How greenery protects against heat and flooding","vii Why tourists prefer green cities","viii Unintended social consequences of new parks"],

     {q:"Paragraph F", a:"iv", why:"Green Network menghubungkan ruang hijau + rel kereta & parkiran bekas dipakai ulang."}

     {q:"8. According to paragraph D, urban areas are warmer than the countryside because", o:["A there are fewer trees producing oxygen.","B buildings and roads store heat and release it later.","C cities produce more water vapour.","D rainfall is lower in cities."], a:1, why:"'Concrete and asphalt absorb heat during the day and release it at night'."},
     {q:"9. What is meant by 'green gentrification'?", o:["A Wealthier people moving into a park's surrounding area and pushing out original residents.","B Replacing housing with parks.","C Painting old buildings green.","D Charging people to use public parks."], a:0, why:"Harga properti naik → penghuni asli terpaksa pindah."},
     {q:"10. The writer mentions Hamburg as an example of a city that", o:["A has the largest park in Europe.","B demolished buildings to create parks.","C connects existing green areas into a network.","D banned cars from the city centre."], a:2, why:"'link existing parks… through continuous green corridors'. B kebalikan dari kalimat terakhir paragraf F."}

 R3:{title:"The Bilingual Advantage: A Debate Revisited", time:20,
  paras:[
   ["A","For much of the twentieth century, bilingualism was viewed with suspicion. Educators warned that children exposed to two languages would become confused, and early studies appeared to confirm that bilingual children scored lower on intelligence tests. In retrospect, these studies were deeply flawed: many compared immigrant children who were still learning the language of the test with monolingual children from wealthier backgrounds."],
   ["B","The pendulum swung dramatically in the opposite direction in the early 2000s. A series of influential experiments, many led by the Canadian psychologist Ellen Bialystok, reported that bilingual children and adults outperformed monolinguals on tasks requiring 'executive control', the mental ability to focus attention, ignore distractions and switch between tasks. The proposed explanation was intuitive: because bilinguals must constantly suppress one language while using the other, they effectively train their brains every time they speak."],
   ["C","The idea attracted enormous media attention, partly because of claims that bilingualism might delay the onset of dementia by several years. For parents and policymakers, the message was irresistible: learning a second language was not only useful for communication but also a form of mental exercise."],
   ["D","In the last decade, however, the 'bilingual advantage' has come under sustained criticism. Several large studies, some involving thousands of participants, have failed to find any consistent difference in executive control between bilinguals and monolinguals. Critics have also identified a publication bias: studies that found an advantage were far more likely to be published than those that did not, creating a misleadingly positive picture of the evidence."],
   ["E","Defenders of the theory respond that 'bilingualism' is not a single experience. Someone who uses two languages every day in very different settings may differ greatly from someone who learned a second language at school and rarely uses it. Grouping such people together, they argue, may hide real effects that occur only under certain conditions."],
   ["F","In my view, the most reasonable conclusion is a modest one. The cognitive benefits of bilingualism, if they exist, are probably smaller and less universal than once claimed. Yet this hardly weakens the case for learning languages, which rests on far more solid ground: access to other cultures, wider career opportunities and the ability to communicate with millions more people. Those reasons were valid long before anyone measured reaction times in a laboratory, and they remain valid today."]
  ],
  groups:[
   {type:"ynng", instr:"Questions 1–5. Do the following statements agree with the views of the writer? Write YES, NO or NOT GIVEN.", qs:[
     {q:"1. Early research on bilingual children was poorly designed.", a:"YES", why:"Paragraf A: 'In retrospect, these studies were deeply flawed'."},
     {q:"2. Bialystok's experiments were deliberately misleading.", a:"NOT GIVEN", why:"Penulis mengkritik bias publikasi secara umum, tapi tidak pernah menuduh Bialystok sengaja menyesatkan."},
     {q:"3. Publication bias exaggerated the evidence for a bilingual advantage.", a:"YES", why:"Paragraf D: 'creating a misleadingly positive picture of the evidence'."},
     {q:"4. The debate about cognitive benefits makes learning languages less worthwhile.", a:"NO", why:"Paragraf F: 'this hardly weakens the case for learning languages'."},
     {q:"5. Bilingual people earn higher salaries than monolingual people.", a:"NOT GIVEN", why:"Disebut 'wider career opportunities', tapi tidak ada klaim soal gaji lebih tinggi."}
   ]},
   {type:"mcq", instr:"Questions 6–8. Choose the correct letter, A, B, C or D.", qs:[
     {q:"6. What explanation was given for the bilingual advantage?", o:["A Bilinguals tend to come from wealthier families.","B Controlling two languages constantly exercises attention.","C Bilinguals spend more time reading.","D Bilinguals start school earlier."], a:1, why:"'must constantly suppress one language… effectively train their brains'."},
     {q:"7. Why did the theory become popular with the public?", o:["A It was supported by every study.","B It suggested benefits beyond communication, including for dementia.","C Governments paid for advertising.","D It was easy to test at home."], a:1, why:"Paragraf C: dementia + 'not only useful for communication but also… mental exercise'."},
     {q:"8. Defenders of the theory argue that", o:["A the large studies used the wrong tests.","B all bilinguals benefit equally.","C different kinds of bilingual experience should not be grouped together.","D monolinguals were not tested properly."], a:2, why:"Paragraf E: 'Grouping such people together… may hide real effects'."}
   ]},
   {type:"ends", instr:"Questions 9–12. Complete each sentence with the correct ending, A–F.", endings:["A have produced no consistent results.","B was once believed to confuse children.","C are based on cultural and practical benefits.","D is used daily in different settings.","E was proven to prevent dementia.","F were only studied in Canada."], qs:[
     {q:"9. Exposure to two languages in childhood…", a:"B", why:"Paragraf A: 'children exposed to two languages would become confused'."},
     {q:"10. Several large-scale studies…", a:"A", why:"Paragraf D: 'failed to find any consistent difference'."},
     {q:"11. The strongest reasons for learning languages…", a:"C", why:"Paragraf F: budaya, karier, komunikasi."},
     {q:"12. Effects may be clearer when a second language…", a:"D", why:"Paragraf E: 'uses two languages every day in very different settings'. E jebakan: teks hanya bilang 'might delay'."}
   ]}
  ]}

 W1:{title:"Task 2 · Opinion essay (intro + 1 body)", time:25, minWords:150, type:"Task 2",
  prompt:"Some people believe that studying online is just as effective as studying in a traditional classroom. To what extent do you agree or disagree?",
  target:"Hari ini tulis INTRO + SATU BODY PARAGRAPH saja (±150–180 kata), 25 menit.",
  steps:["Garis bawahi kata kunci soal: 'just as effective', 'to what extent'. Soal ini minta POSISIMU, dan posisi itu harus konsisten dari intro sampai kesimpulan.","Intro (2 kalimat): (1) parafrase soal, jangan copy; (2) thesis statement yang jelas, mis. 'I largely disagree, because…'.","Body: kalimat topik → jelaskan KENAPA → contoh spesifik → kaitkan balik ke posisimu.","Sisakan 3 menit untuk cek: artikel (a/the), -s jamak, subject-verb agreement."],
  useful:["It is often argued that…","While online learning offers undeniable flexibility, …","I would argue that… largely because…","This is particularly evident in…","A case in point is…","Consequently, …","For this reason, …"],
  model:`In recent years, the rapid expansion of internet-based courses has led some to claim that learning online is equally as effective as attending lessons in person. While I accept that digital learning has clear advantages in terms of flexibility, I largely disagree with this view, as face-to-face teaching remains superior for developing practical skills and sustaining motivation.

The most compelling reason is that many forms of knowledge cannot be fully acquired through a screen. This is particularly evident in fields such as medicine, nursing or engineering, where students must practise physical procedures under direct supervision. A medical student, for instance, may watch dozens of videos on how to examine a patient's abdomen, yet only by doing so in a clinical setting, with a tutor correcting the position of their hands, will they master the technique. Moreover, classroom learning provides immediate, spontaneous interaction: a puzzled expression can prompt a teacher to rephrase an explanation, something that is far harder to detect in a video call with cameras switched off.

A second consideration is motivation. Studying alone at home demands considerable self-discipline, and online courses are known for their high drop-out rates. In a physical classroom, by contrast, fixed timetables, peer pressure and the simple presence of classmates help learners to stay on track.

Admittedly, online platforms are invaluable for revising theory, accessing world-class lecturers and fitting study around work or family commitments. However, these benefits make online learning a useful complement to traditional education rather than an equal substitute for it.

In conclusion, although studying online is convenient and suitable for certain purposes, I believe that classroom learning remains more effective overall, particularly for practical subjects and for learners who need structure to remain motivated.`,
  notes:["Thesis jelas di kalimat ke-2 intro → Task Response kuat dari awal.","Satu body = satu ide utama, dikembangkan penuh dengan contoh spesifik (medical student).","Kohesi tidak mencolok: 'Moreover', 'by contrast', 'Admittedly… However' dipakai seperlunya.","Kolokasi natural: 'clear advantages', 'sustaining motivation', 'high drop-out rates', 'a useful complement… rather than an equal substitute'."]},
 W2:{title:"Task 1 · Line graph: overnight visitors", time:20, minWords:150, type:"Task 1", chart:true,
  prompt:"The graph below shows the number of overnight visitors (in millions) to three European cities, Lucerne, Hamburg and Bruges, between 2000 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
  target:"Tulis minimal 150 kata dalam 20 menit.",
  steps:["Paragraf 1: parafrase soal (apa, di mana, kapan). Jangan menyalin.","Paragraf 2 = OVERVIEW: 2 tren paling besar, TANPA angka detail. Ini syarat utama band 7 ke atas.","Paragraf 3–4: kelompokkan data (mis. Hamburg sendiri; Lucerne & Bruges berdua), pakai angka penting + perbandingan.","Jangan beropini atau menebak penyebab."],
  useful:["rose steadily / climbed sharply","peaked at… in…","levelled off at around…","fell to a low of…","overtook…","remained relatively stable","By contrast, …","…, more than double the figure for…"],
  data:{years:[2000,2005,2010,2015,2020], series:[["Hamburg",[4.0,5.5,8.0,12.5,7.0],"#5B6CFF"],["Lucerne",[2.0,2.5,3.0,4.5,2.5],"#FF4F8B"],["Bruges",[3.0,3.0,3.5,4.0,1.5],"#11B3A3"]]},
  model:`The line graph illustrates how many tourists stayed overnight in three European cities, namely Hamburg, Lucerne and Bruges, over a twenty-year period from 2000 to 2020.

Overall, Hamburg attracted by far the largest number of overnight visitors throughout the period, and its figures grew most dramatically. All three cities saw a sharp decline in the final five years, with Bruges ending the period at its lowest point.

In 2000, Hamburg received 4 million overnight visitors, slightly more than Bruges (3 million) and double the figure for Lucerne (2 million). Over the following fifteen years, visitor numbers in Hamburg rose steadily and then more steeply, reaching a peak of 12.5 million in 2015, roughly three times its initial level.

The two smaller cities followed a more modest pattern. Bruges remained relatively stable at around 3 to 4 million until 2015, while Lucerne climbed gradually and overtook Bruges in 2015, when it peaked at 4.5 million. Between 2015 and 2020, however, all three cities experienced a significant fall: Hamburg dropped to 7 million, Lucerne returned to 2.5 million, and Bruges plunged to just 1.5 million, half of its starting figure.`,
  notes:["Overview tanpa angka, menyebut 2 fitur utama → ini yang paling membedakan band 6 vs 8+.","Data dikelompokkan (Hamburg vs dua kota kecil) bukan dibahas tahun per tahun.","Variasi bahasa tren: rose steadily, more steeply, peaked, overtook, plunged.","Tidak ada spekulasi penyebab (mis. pandemi) karena tidak ada di grafik."]},
 W3:{title:"Task 2 · Discussion essay (full, 40 menit)", time:40, minWords:250, type:"Task 2",
  prompt:"Some people think that the best way to improve public health is to increase the number of sports facilities. Others, however, believe that this would have little effect and that other measures are required. Discuss both views and give your own opinion.",
  target:"Full essay ≥250 kata, 40 menit, pakai timer. Rencanakan 5 menit dulu.",
  steps:["Tipe soal: 'Discuss both views AND give your opinion' → wajib 3 hal: pandangan 1, pandangan 2, opinimu (di intro DAN kesimpulan).","Rencana 5 menit: 1 body untuk tiap pandangan, tiap body 2 ide + contoh.","Pakai pengetahuan kedokteranmu (faktor risiko, preventif, determinan sosial kesehatan) sebagai contoh. Ini nilai plus untuk Task Response.","3 menit terakhir: cek artikel, jamak, tenses, dan pengulangan kata."],
  useful:["Proponents of this view argue that…","On the other hand, critics contend that…","There is some merit in this argument, since…","However, this overlooks the fact that…","Tackling the root causes of…","In my view, a combination of… is required."],
  model:`Public health has become a pressing concern in many countries, as rates of obesity, diabetes and heart disease continue to rise. While some argue that building more sports facilities is the most effective solution, others maintain that such investment would achieve little on its own. In my view, sports facilities are beneficial but insufficient, and they must form part of a wider strategy.

Those who favour sports facilities point out that a sedentary lifestyle is one of the leading risk factors for chronic illness. If people have convenient access to swimming pools, cycling lanes and affordable gyms, they are more likely to exercise regularly, which helps to prevent weight gain, lower blood pressure and improve mental well-being. Community sports centres can also bring people together, reducing the social isolation that is itself associated with poor health.

However, critics rightly argue that availability does not guarantee use. Many people with the poorest health are prevented from exercising not by a lack of facilities but by long working hours, financial pressure or limited health awareness. Moreover, physical activity alone cannot compensate for an unhealthy diet, smoking or untreated conditions such as hypertension. For this reason, measures such as taxing sugary drinks, restricting tobacco advertising, offering free health screening and teaching nutrition in schools are likely to have a greater impact on the population as a whole.

In my opinion, the most effective approach addresses both the opportunity to be active and the underlying causes of illness. Sports facilities should therefore be built where they are most needed, such as in low-income areas, but they should be combined with preventive healthcare and education.

In conclusion, while additional sports facilities can certainly contribute to a healthier population, they are unlikely to transform public health unless they are accompanied by broader policies that tackle diet, addiction and access to care.`,
  notes:["Opini muncul di intro dan kesimpulan, konsisten ('beneficial but insufficient').","Kedua pandangan dibahas adil, lalu penulis memberi sintesis di paragraf sendiri.","Contoh dari dunia kesehatan spesifik: sedentary lifestyle, hypertension, sugar tax, screening.","Range grammar: conditional ('If people have…'), passive, relative clause, participle ('accompanied by')."]}

 S1:{title:"Part 1 · About you", part:1,
  tips:["Jawab 2–4 kalimat: jawaban langsung → alasan → contoh/detail. Jangan cuma 'Yes, I do.'","Jangan menghafal kalimat panjang; examiner bisa membedakan jawaban hafalan.","Boleh pakai filler alami: 'Well, …', 'To be honest, …', 'I'd say…'.","Shadowing: putar jawaban model, tirukan sambil menempel 1 detik di belakang suaranya. Fokus ke tekanan kata dan intonasi naik-turun."],
  qs:[
   {q:"Do you work or are you a student?", m:"I'm a medical student, currently in my pre-clinical years. It's demanding, to be honest, because we cover a huge amount of material every week, but I find it genuinely rewarding, especially when a topic I've studied in theory suddenly makes sense in a real clinical case."},
   {q:"Why did you choose to study medicine?", m:"Mainly because I've always been drawn to working with children. I'm hoping to specialise in paediatrics eventually. I think there's something special about helping a child recover and seeing the relief on the parents' faces."},
   {q:"Where is your hometown?", m:"I'm from Indonesia, from a fairly busy city in East Java. It's not particularly famous among tourists, but it has a really lively food scene, and there are mountains within driving distance, so it's easy to escape the heat at the weekend."},
   {q:"How do you usually spend your weekends?", m:"It depends on my exam schedule, really. During busy weeks I spend most of the weekend catching up on lectures, but when I have some free time, I like to go out for brunch with friends or just stay in and watch a film to recharge."},

   {q:"Would you like to learn another language in the future?", m:"Definitely. Once my English is where I want it to be, I'd love to pick up some German. I've always been fascinated by cities like Hamburg, and I think being able to chat with locals in their own language would make travelling there far more meaningful."}

 S2:{title:"Part 2 · Cue card: a place you'd like to visit", part:2,
  card:{topic:"Describe a place in another country that you would like to visit.", points:["where it is","how you know about it","what you would do there","and explain why you would like to visit this place."]},
  tips:["1 menit persiapan: tulis KATA KUNCI saja (bukan kalimat) untuk tiap poin di kartu.","Bicara terus sampai examiner menghentikanmu di 2 menit. Kalau ide habis, ceritakan detail (warna, suara, perasaan), atau pengalaman pribadi.","Pakai tenses beragam: present (it is), past (I first saw it), future/conditional (I would…, if I…).","Bagian 'explain why' paling penting: di situ kosakata dan kedalaman ide paling terlihat."],
  m:`The place I'd really love to visit is Lauterbrunnen, a small village in the Swiss Alps, not far from Interlaken.

I first came across it a couple of years ago, when a photo of the valley appeared on my social media feed. To be honest, I thought it had been edited, because it looked almost too perfect: a deep green valley with enormous rock walls on both sides and dozens of waterfalls pouring down from the cliffs. Later I found out that there are actually more than seventy waterfalls there, and the most famous one, Staubbach Falls, drops right behind the village.

If I had the chance to go, I'd spend at least three or four days there. I'd start by hiking along the valley floor and then take the cable car up to one of the car-free mountain villages, like Mürren, where you can see the snow-capped peaks up close. I'd also love to try Swiss chocolate and cheese fondue, which I know is a bit of a cliché, but I think it's part of the experience.

As for why I want to go, I think there are two main reasons. Firstly, I grew up in a tropical country, so I've never experienced a landscape like that, with snow, glaciers and cold, fresh air. Secondly, and perhaps more importantly, it's become a kind of personal goal. Medical school can be exhausting, and whenever I feel overwhelmed, looking at pictures of places like Lauterbrunnen reminds me why I'm working so hard on my English and my studies. So for me, visiting it one day would feel like a reward for all those late nights.`,
  phrases:["I first came across it…","It looked almost too perfect.","snow-capped peaks","…is a bit of a cliché, but…","As for why…","It would feel like a reward for…"]},
 S3:{title:"Part 3 · Travel, tourism & languages", part:3,
  tips:["Part 3 menilai kemampuan membahas ide abstrak. Struktur aman: posisi → alasan → contoh → (opsional) sisi lain.","Hedging = tanda bahasa tingkat tinggi: 'I'd argue that…', 'It largely depends on…', 'To some extent…'.","Bandingkan masa lalu–sekarang–masa depan, atau kelompok berbeda (orang muda vs tua, kota vs desa).","Kalau tidak tahu faktanya, berpendapat saja dengan alasan logis. Yang dinilai bahasanya, bukan kebenaran faktanya."],
  qs:[
   {q:"Why do you think international travel has become so popular?", m:"I'd say there are several factors. The most obvious one is cost: budget airlines have made flying affordable for people who could never have travelled abroad a generation ago. Social media has also played a huge role, because people constantly see photos of beautiful places and feel they're missing out. And on a deeper level, I think many people travel to escape the pressure of work and to experience something genuinely different."},
   {q:"What are the negative effects of mass tourism on local communities?", m:"The most visible problem is overcrowding. In places like Hallstatt in Austria, the number of daily visitors can be many times the local population, which makes ordinary life quite difficult for residents. There's also an economic side: when too many flats are rented out to tourists, housing becomes unaffordable for local people. So although tourism brings income, it can gradually change the character of a place."},
   {q:"How could governments manage tourism better?", m:"I think a combination of measures is needed. Some cities have introduced tourist taxes or daily visitor limits, which can reduce pressure while raising money for maintenance. Another approach is to promote lesser-known destinations so that visitors are spread more evenly. Ideally, though, local residents should have a say in these decisions, since they're the ones most affected."},
   {q:"Is it necessary to learn the local language before visiting a country?", m:"Necessary, probably not, since English and translation apps will get you quite far. But I'd argue it's extremely worthwhile to learn at least a few basic phrases. It shows respect, and in my experience people respond far more warmly when you make an effort, even if your pronunciation isn't perfect."},

  lesson:`<p><b>Kenapa ini dulu?</b> Bahasa Indonesia tidak punya artikel, jamak wajib, atau perubahan kata kerja per subjek. Akibatnya tiga hal ini adalah kesalahan paling sering penutur Indonesia, dan examiner menghitungnya di <i>Grammatical Accuracy</i>. Band 9 = kesalahan seperti ini hampir tidak ada.</p>

 G3:{title:"Conditionals & inversion (range band 8–9)",
  lesson:`<p><b>Kenapa?</b> Band 9 grammar = 'wide range of structures with full flexibility'. Conditional campuran dan inversion menunjukkan kontrol tinggi, asal dipakai secara natural, jangan dipaksakan di setiap kalimat.</p>
<p><b>Zero</b> (fakta): <i>If you heat ice, it melts.</i><br><b>First</b> (mungkin terjadi): <i>If cities build more parks, residents <u>will</u> be healthier.</i><br><b>Second</b> (hipotesis sekarang): <i>If I <u>lived</u> in Hamburg, I <u>would</u> cycle everywhere.</i><br><b>Third</b> (masa lalu, tidak terjadi): <i>If I <u>had studied</u> earlier, I <u>would have passed</u>.</i><br><b>Mixed</b> (masa lalu → efek sekarang): <i>If I <u>had learned</u> German as a child, I <u>would be</u> fluent now.</i></p>
<p><b>Alternatif 'if'</b>: <i>unless, provided that, as long as, otherwise</i>.<br><b>Inversion</b> (formal): <i><u>Had I known</u>, I would have come.</i> (= If I had known) · <i><u>Should you</u> need help, call me.</i> · <i><u>Not only does</u> exercise improve fitness, <u>but it also</u> reduces stress.</i> · <i><u>Rarely do</u> we see such results.</i></p>`,

ENG_READ.T1R = {title:"The Science of the Afternoon Nap", time:10,
  paras:[
   ["A","For centuries, napping in the afternoon was regarded in many industrialised societies as a sign of laziness. Yet in large parts of the world, from Spain to Indonesia, a short rest after lunch has long been part of daily life. Scientists are now paying closer attention to this habit, and much of the evidence suggests that a well-timed nap can sharpen the mind."],
   ["B","One of the best-known studies was carried out by NASA in the 1990s. Pilots on long-haul flights who were given a planned rest period of 40 minutes, during which they slept for an average of 26 minutes, showed a 34 per cent improvement in performance and a 54 per cent improvement in alertness compared with colleagues who stayed awake. Later laboratory research found that even ten minutes of sleep could reduce tiredness for up to two and a half hours."],
   ["C","However, longer is not always better. Naps lasting more than about 30 minutes allow the brain to enter deep sleep, and waking from this stage often leads to 'sleep inertia', a groggy feeling that can last for half an hour or more. For this reason, many sleep researchers recommend keeping naps short, or else sleeping for a full cycle of roughly 90 minutes. They also warn that napping late in the afternoon may make it harder to fall asleep at night, particularly for people who already suffer from insomnia."]
  ],

function engChart(dt){

  return s + '<text x="12" y="'+(tp+ (H-tp-b)/2)+'" font-size="11" fill="#6C6590" transform="rotate(-90 12 '+(tp+(H-tp-b)/2)+')" text-anchor="middle">millions</text></svg>';
}

function engSummary(){
  const e = E(), lines = ["Ringkasan English "+ENG_DAYS.length+" hari (Ruang Belajar Nadia)", "Task selesai: "+engTotals().done+"/"+engTotals().all+" · streak "+engStreak()+" hari · kolokasi dikuasai "+engMastered()+"/36"];
  Object.keys(e.sc).sort().forEach(k => lines.push(k+": "+e.sc[k].s+"/"+e.sc[k].t));
  Object.keys(e.ai).forEach(k => { if (e.ai[k].band) lines.push(k+" band: "+e.ai[k].band); });
  ["Listening","Reading","Writing","Speaking"].forEach(s => { if (e.ev[s]) lines.push("Self-rating "+s+": "+e.ev[s]); });
  const src = {}; e.err.forEach(x => src[x.src] = (src[x.src]||0)+1); if (e.err.length) lines.push("Kesalahan per materi: "+Object.entries(src).map(([k,v]) => k+" "+v).join(", "));
  if (e.ev.sulit) lines.push("Paling sulit: "+e.ev.sulit); if (e.ev.fokus) lines.push("Fokus berikutnya: "+e.ev.fokus);
  return lines.join("\n");
}

/* kalender .ics (alarm tetap bunyi walau web ditutup) */
function engICS(){
  const e = E(), [hh, mm] = e.time.split(":"), pad = n => String(n).padStart(2,"0");
  const ev = ENG_DAYS.map((D, j) => { const dt = engDate(j+1).replace(/-/g,""), st = dt+"T"+pad(hh)+pad(mm)+"00", endM = (+hh)*60 + (+mm) + 45, en = dt+"T"+pad(Math.floor(endM/60)%24)+pad(endM%60)+"00";
    return ["BEGIN:VEVENT","UID:eng-"+dt+"@ruang-belajar-nadia","DTSTAMP:"+dt+"T000000Z","DTSTART:"+st,"DTEND:"+en,"SUMMARY:English Day "+(j+1)+": "+D.title,"DESCRIPTION:"+D.tasks.map(t => ENG_KIND[t.k]+" - "+engTaskTitle(t)).join(" | ").replace(/[,;]/g," ")+" — buka tab English di Ruang Belajar Nadia","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Waktunya English!","TRIGGER:-PT0M","END:VALARM","END:VEVENT"].join("\r\n"); });
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ruang Belajar Nadia//English//ID","CALSCALE:GREGORIAN"].concat(ev, ["END:VCALENDAR"]).join("\r\n");
}
async function engDownload(name, text, type){
  const blob = new Blob([text], {type});
  if (DLNS) { try { await DLNS.save({filename:name, data:blob}); } catch(err){ if (!(err && err.code === "declined")) toast("Gagal mengunduh"); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function engCopy(text, okMsg){ try { navigator.clipboard.writeText(text).then(() => toast(okMsg||"Disalin"), () => engCopyFallback(text)); } catch(err){ engCopyFallback(text); } }
function engCopyFallback(text){ const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast("Disalin"); } catch(e){ toast("Tidak bisa menyalin otomatis"); } t.remove(); }

function checkEngReminderOld(){
  const t = todayISO(), e = E(), n = engDayNo(); if (n < 1 || n > ENG_DAYS.length || e.ack[t] || engDayDone(n)) return;
  const now = new Date(), hm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");

    const D = ENG_DAYS[n-1];
    $("#bannerHost").innerHTML = '<div class="banner" role="alert"><div style="flex:1"><b>Jam '+esc(e.time)+': waktunya English, Nadia!</b><div class="small" style="color:#CFC8F0">Day '+n+' · '+esc(D.title)+'</div></div><button class="btn tiny" data-act="engsnooze">15 menit lagi</button><button class="btn tiny" data-act="engbanner">Buka</button></div>';

}

  '<div class="wv-filters"><div class="wv-chips">'+chip("all","Semua · "+WV_LIST.length, f.cat==="all", ' data-v="all"')+Object.keys(WV_CATS).map(c => chip("cat", WV_CATS[c].e+" "+esc(WV_CATS[c].nm)+" · "+cnt(c), f.cat===c, ' data-v="'+c+'"')).join("")+'</div>'+
  '<div class="row wv-tools"><input id="wvQ" type="search" placeholder="Cari judul, channel, topik…" value="'+esc(f.q)+'">'+
    chip("lang","Semua bahasa", f.lang==="all", ' data-v="all"')+chip("lang","🇬🇧 English", f.lang==="en", ' data-v="en"')+chip("lang","🇮🇩 Indonesia", f.lang==="id", ' data-v="id"')+
    chip("hide","Sembunyikan yang sudah", f.hide)+chip("fav","♥ Favorit", f.fav)+'</div></div>'+
  '<p class="small muted" id="wvCount">'+list.length+' video</p>'+
  (list.length ? '<div class="wv-grid" id="wvGrid">'+list.map(v => wvCard(v)).join("")+'</div>' : '<div class="card"><p class="muted">Belum ada yang cocok. Coba ganti filternya ya.</p></div>')+
  '<p class="small muted" style="margin-top:18px">Semua link sudah dicek masih aktif per 9 Nov 2026. Klik gambar atau judul untuk buka di YouTube. Kalau ada yang nggak nyambung atau kurang dalam, bilang aja nanti diganti.</p>';
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !/^wv/.test(el.dataset.act)) return;
  const f = ui.wv, X = WV(), a = el.dataset.act;
  if (a === "wvf") { const k = el.dataset.k, v = el.dataset.v;
    if (k === "all") f.cat = "all"; else if (k === "cat") f.cat = (f.cat === v ? "all" : v); else if (k === "lang") f.lang = v; else if (k === "hide") f.hide = !f.hide; else if (k === "fav") f.fav = !f.fav;
    render(); }
  if (a === "wvrand") { let pool = WV_LIST.filter(v => (f.cat === "all" || v[0] === f.cat) && (f.lang === "all" || v[5] === f.lang) && !X.done[v[1]] && v[1] !== f.pick); if (!pool.length) pool = WV_LIST.filter(v => !X.done[v[1]]); if (!pool.length) { toast("Wow, semua video sudah kamu tonton! 🎉"); return; } f.pick = pool[Math.floor(Math.random()*pool.length)][1]; render(); window.scrollTo({top:0, behavior:"smooth"}); }
  if (a === "wvunpick") { f.pick = null; render(); }
  if (a === "wvfav") { const id = el.dataset.id; if (X.fav[id]) delete X.fav[id]; else X.fav[id] = todayISO(); save(); render(); }
});
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.wvdone; if (!id) return;
  const X = WV(); if (e.target.checked) { X.done[id] = todayISO(); toast("Satu wawasan baru masuk kepala ✦"); } else delete X.done[id];
  save(); const y = window.scrollY; render(); window.scrollTo({top:y});
});
document.addEventListener("input", e => {
  if (e.target.id !== "wvQ") return; ui.wv.q = e.target.value;
  const list = wvFiltered(), g = $("#wvGrid"), c = $("#wvCount");
  if (c) c.textContent = list.length+" video";
  if (g) { g.innerHTML = list.map(v => wvCard(v)).join(""); wvThumbs(); } else render();
});

/* routing */
function go(v){ if (location.hash !== "#"+v) location.hash = v; else { view = v; render(); window.scrollTo({top:0}); } }
function fromHash(){ const h = (location.hash||"").replace("#",""); view = VIEWS.includes(h) ? h : "beranda"; render(); window.scrollTo({top:0}); }
window.addEventListener("hashchange", fromHash);

/* boot */
(function boot(){
  const local = lsGet(); if (local) S = merge(S, local);
  fromHash();
  setInterval(checkReminder, 30000); setTimeout(checkReminder, 1500);
  initDb();
  fetch("kating-repro.json").then(r => r.ok ? r.json() : null).then(j => { if (Array.isArray(j)) { KAT_REPRO = j; const y = window.scrollY; render(); window.scrollTo({top:y}); } }).catch(() => {});
  fetch("buatan-repro.json").then(r => r.ok ? r.json() : null).then(j => { if (Array.isArray(j)) { BUATAN_REPRO = j; const y = window.scrollY; render(); window.scrollTo({top:y}); } }).catch(() => {});
})();
</script>
